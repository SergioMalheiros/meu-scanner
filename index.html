  // ---------- lista do dia na nuvem ----------
  // Antes, a lista colada ficava só no aparelho de quem colou — os outros que
  // trabalham na mesma rota tinham que colar tudo de novo, cada um no seu
  // celular. Agora ela sobe junto com a rota: quem entra depois só põe o
  // código da rota e já cai com a lista pronta, com o progresso e as fotos de
  // quem já começou. Fica guardada por data, então vira o dia e some sozinha.
  //
  // Modelo simples de propósito: a lista da nuvem é A lista do dia da rota.
  // Quem organizar por último vale pra todo mundo — do mesmo jeito que hoje
  // só uma pessoa cola a lista pra todos.
  function enviarListaParaNuvem() {
    if (!fbDb || !state.minhaRota) return;
    fbDb.ref("lotes/" + sanitizarChaveFirebase(state.minhaRota) + "/lista/" + dataDeHoje())
      .set({ texto: state.textoColado, ts: Date.now() });
  }
  function removerListaDaNuvem() {
    if (!fbDb || !state.minhaRota) return;
    fbDb.ref("lotes/" + sanitizarChaveFirebase(state.minhaRota) + "/lista/" + dataDeHoje()).remove();
  }
  // Depois de adotar a lista da nuvem, o que já foi separado/fotografado
  // precisa ser lido de novo: os listeners de pacotes e entregas só disparam
  // quando algo MUDA lá, e eles já tinham rodado sem efeito nenhum antes de
  // existir lista aqui pra casar os códigos. Reaproveita os próprios
  // callbacks, então a regra de aplicar é uma só.
  function recarregarProgressoDaRota(chaveRota, data) {
    if (!fbDb) return;
    fbDb.ref("lotes/" + chaveRota + "/pacotes").once("value").then(function (snap) {
      if (callbackPacotesAtual) callbackPacotesAtual(snap);
    }).catch(function () {});
    fbDb.ref("lotes/" + chaveRota + "/entregas/" + data).once("value").then(function (snap) {
      if (callbackEntregasAtual) callbackEntregasAtual(snap);
    }).catch(function () {});
  }

  function organizarPacotes() {
    state.linhasParseadas = parseLinhas(state.textoColado);
    state.encontrados = {};
    salvarSessao();
    enviarListaParaNuvem();
    // Puxa de volta o que a rota já tem hoje (o que o colega já separou, as
    // fotos e os nomes de quem recebeu). Sem isso, quem colava a lista num
    // aparelho novo começava do zero na tela mesmo com a rota já andando —
    // os avisos da nuvem só chegam quando ALGUÉM grava algo novo, e aqui
    // ninguém tinha gravado ainda.
    if (fbDb && state.minhaRota) recarregarProgressoDaRota(sanitizarChaveFirebase(state.minhaRota), dataDeHoje());
    render();
  }
  var refPacotesAtual = null;
  var callbackPacotesAtual = null;
  var refEntregasAtual = null;
  var callbackEntregasAtual = null;
  var refFachadasAtual = null;
  var callbackFachadasAtual = null;
  var refFaixasAtual = null;
  var callbackFaixasAtual = null;
  var refListaAtual = null;
  var callbackListaAtual = null;

  function desconectarRota() {
    if (refPacotesAtual && callbackPacotesAtual) refPacotesAtual.off("value", callbackPacotesAtual);
    if (refEntregasAtual && callbackEntregasAtual) refEntregasAtual.off("value", callbackEntregasAtual);
    if (refFachadasAtual && callbackFachadasAtual) refFachadasAtual.off("value", callbackFachadasAtual);
    if (refFaixasAtual && callbackFaixasAtual) refFaixasAtual.off("value", callbackFaixasAtual);
    if (refListaAtual && callbackListaAtual) refListaAtual.off("value", callbackListaAtual);
    refPacotesAtual = null; callbackPacotesAtual = null;
    refEntregasAtual = null; callbackEntregasAtual = null;
    refFachadasAtual = null; callbackFachadasAtual = null;
    refFaixasAtual = null; callbackFaixasAtual = null;
    refListaAtual = null; callbackListaAtual = null;
  }

  function limparFotosAntigas(chaveRota) {
    // As fotos agora ficam no Cloudinary via upload "unsigned", que não dá pra
    // apagar direto pelo navegador sem expor a API secret da conta. Aqui só
    // limpamos os registros antigos do Firebase; as imagens em si continuam no
    // Cloudinary (dá pra apagar manualmente de vez em quando pelo Media Library,
    // se quiser liberar espaço).
    // "fachadas_permanentes" fica de fora de propósito: não é organizado por
    // data (é por endereço, pra sempre), então não faz sentido limpar por
    // idade — e limpar aqui usando essa mesma lógica ia apagar tudo por
    // engano (a chave lá é do endereço, não uma data, e viraria NaN dia).
    if (!fbDb) return;
    ["entregas"].forEach(function (secao) {
      fbDb.ref("lotes/" + chaveRota + "/" + secao).once("value").then(function (snap) {
        var porData = snap.val() || {};
        Object.keys(porData).forEach(function (dataStr) {
          if (diasEntre(dataStr, dataDeHoje()) <= 2) return;
          fbDb.ref("lotes/" + chaveRota + "/" + secao + "/" + dataStr).remove();
        });
      }).catch(function () {});
    });
  }

  function conectarRota(rota) {
    desconectarRota();
    state.rotaConectada = false;
    if (!fbDb || !rota) return;
    var chaveRota = sanitizarChaveFirebase(rota);
    fbDb.ref("rotas_registradas/" + chaveRota).set(Date.now());
    limparFotosAntigas(chaveRota);

    refFaixasAtual = fbDb.ref("lotes/" + chaveRota + "/faixas");
    callbackFaixasAtual = function (snapshot) {
      var remoto = snapshot.val();
      var ruasRemotas = (remoto && remoto.ruas && remoto.ruas.length) ? remoto.ruas : null;

      if (!ruasRemotas) {
        // Nuvem ainda sem nada pra essa rota: se este aparelho já tem faixas
        // configuradas, ele vira a fonte e faz o primeiro backup.
        if (state.mapaRuas.length) enviarFaixasParaNuvem();
        return;
      }
      // Este aparelho já tem faixas: a daqui manda, e nada é trocado sozinho.
      if (state.mapaRuas.length) return;
      // Aparelho sem nada configurado: restaura da nuvem, porque não há o que
      // perder aqui (celular novo, navegador limpo, ou colega entrando na
      // rota pela primeira vez).
      state.mapaRuas = normalizarMapaRuas(ruasRemotas);
      salvar("mapa-ruas", state.mapaRuas);
      render();
    };
    refFaixasAtual.on("value", callbackFaixasAtual);

    var data = dataDeHoje();
    refEntregasAtual = fbDb.ref("lotes/" + chaveRota + "/entregas/" + data);
    callbackEntregasAtual = function (snapshot) {
      var dados = snapshot.val() || {};
      var novo = {};
      Object.keys(dados).forEach(function (codigo) {
        var item = dados[codigo];
        var linha = state.linhasParseadas && state.linhasParseadas.find(function (l) { return l.codigo === codigo; });
        if (!linha) return;
        // Compatibilidade com fotos tiradas antes dessa atualização (campo
        // antigo "fotoPacoteUrl", uma foto só) — trata como se fosse a foto
        // do slot 0, assim nada some pra quem já tinha tirado foto hoje.
        var fotos = item.fotos || (item.fotoPacoteUrl ? { "0": item.fotoPacoteUrl } : {});
        novo[linha.id] = { quemRecebeu: item.quemRecebeu || "", fotos: fotos };
      });
      state.entregaInfo = novo;
      render();
    };
    refEntregasAtual.on("value", callbackEntregasAtual);

    refFachadasAtual = fbDb.ref("lotes/" + chaveRota + "/fachadas_permanentes");
    callbackFachadasAtual = function (snapshot) {
      var dados = snapshot.val() || {};
      var novo = {};
      Object.keys(dados).forEach(function (chave) { novo[chave] = dados[chave].fotoFachadaUrl || ""; });
      state.fachadaInfo = novo;
      render();
    };
    refFachadasAtual.on("value", callbackFachadasAtual);

    refPacotesAtual = fbDb.ref("lotes/" + chaveRota + "/pacotes");
    var primeiraLeitura = true;
    callbackPacotesAtual = function (snapshot) {
      state.rotaConectada = true;
      var dados = snapshot.val() || {};
      if (!state.linhasParseadas) { render(); return; }
      // Código repetido em mais de uma linha (ver aviso em calcularResultado)
      // faz mais de um id de linha "torcer" pro mesmo código — antes isso
      // guardava só o ÚLTIMO id de cada código, então uma confirmação da
      // nuvem (inclusive a do próprio aparelho, voltando depois do envio)
      // podia cair marcada numa encomenda ERRADA, sem ninguém ter escaneado
      // ou clicado nela. Agora guarda TODAS as linhas daquele código.
      var porCodigo = {};
      state.linhasParseadas.forEach(function (l) {
        if (l.erro || !l.codigo) return;
        if (!porCodigo[l.codigo]) porCodigo[l.codigo] = [];
        porCodigo[l.codigo].push(l.id);
      });
      var mudou = false;
      Object.keys(dados).forEach(function (codigo) {
        var idsDoCodigo = porCodigo[codigo];
        if (!idsDoCodigo || !idsDoCodigo.length) return;
        var remoto = dados[codigo] || {};
        var novo = { separado: !!remoto.separado, entregue: !!remoto.entregue, devolvido: !!remoto.devolvido };
        // Código único (o caso normal): sempre foi só 1 id, comportamento
        // idêntico ao de antes. Código repetido: se alguma das linhas já
        // bate com o que a nuvem mandou, não mexe em nada (evita marcar uma
        // encomenda de verdade sem ninguém ter tocado nela); só quando
        // NENHUMA bate é que aplica numa linha ainda intocada, pra avançar
        // sempre uma encomenda física diferente por vez — igual ao scanner.
        var jaBate = idsDoCodigo.some(function (id) {
          var st = state.pacoteStatus[id] || { separado: false, entregue: false, devolvido: false };
          return st.separado === novo.separado && st.entregue === novo.entregue && st.devolvido === novo.devolvido;
        });
        if (jaBate) return;
        var linhaId = idsDoCodigo.find(function (id) { return !state.pacoteStatus[id]; }) || idsDoCodigo[0];
        state.pacoteStatus[linhaId] = novo;
        mudou = true;
      });
      if (primeiraLeitura) {
        primeiraLeitura = false;
        state.linhasParseadas.forEach(function (l) {
          if (l.erro || !l.codigo) return;
          var localSt = state.pacoteStatus[l.id];
          if (!localSt) return;
          var remotoSt = dados[l.codigo] || {};
          var atrasado = (localSt.separado && !remotoSt.separado) || (localSt.entregue && !remotoSt.entregue) || (localSt.devolvido && !remotoSt.devolvido);
          if (atrasado) fbDb.ref("lotes/" + chaveRota + "/pacotes/" + l.codigo).set({
            separado: !!localSt.separado, entregue: !!localSt.entregue, devolvido: !!localSt.devolvido, ts: Date.now()
          });
        });
        limparPacotesAntigos(chaveRota, dados);
      }
      if (mudou) salvarSessao();
      render();
    };
    refPacotesAtual.on("value", callbackPacotesAtual, function () { state.rotaConectada = false; render(); });

    // Assinado por último de propósito: quando a lista da nuvem chega, ela
    // chama os callbacks de pacotes/entregas acima, que já precisam existir.
    refListaAtual = fbDb.ref("lotes/" + chaveRota + "/lista/" + data);
    callbackListaAtual = function (snapshot) {
      var remoto = snapshot.val();
      var texto = (remoto && typeof remoto.texto === "string") ? remoto.texto : "";
      // Nuvem sem lista pra hoje: não mexe em nada aqui (é o caso de alguém
      // ter limpado — quem já está com a lista aberta continua trabalhando).
      if (!texto.trim()) return;
      // Já é exatamente essa lista: nada a fazer (evita re-render à toa e
      // volta-e-meia depois do próprio envio).
      if (texto === state.textoColado && state.linhasParseadas) return;
      state.textoColado = texto;
      state.linhasParseadas = parseLinhas(texto);
      // Zera o progresso local antes de reaplicar o da nuvem: se este
      // aparelho tinha uma lista antiga, as marcações dela são de outros
      // pacotes e não valem mais nada aqui.
      state.pacoteStatus = {};
      salvarSessao();
      recarregarProgressoDaRota(chaveRota, data);
      render();
    };
    refListaAtual.on("value", callbackListaAtual);
  }

  function salvarMinhaRota(rota) {
    state.minhaRota = rota;
    salvar("minha-rota", rota);
    conectarRota(rota);
    render();
  }

  // Sair da rota: desliga a sincronização e devolve este aparelho pro modo
  // "só aqui". Leva junto a lista do dia (ela é da rota — não faz sentido
  // continuar aberta fora dela) e o progresso local, mas NÃO mexe em nada na
  // nuvem: lista, marcações e fotos seguem lá pros colegas. As Faixas ficam,
  // porque são a sua configuração de ruas, não uma coisa do dia.
  function sairDaRota() {
    if (!state.minhaRota) return;
    var aviso = "Sair da rota " + state.minhaRota + " neste aparelho?\n\n" +
      "A lista de hoje sai daqui, mas continua na nuvem pros outros. Suas ruas (Faixas) ficam.";
    if (state.filaPendente.length) {
      aviso += "\n\nAten\u00e7\u00e3o: ainda " + (state.filaPendente.length === 1 ? "h\u00e1 1 foto esperando envio" : "h\u00e1 " + state.filaPendente.length + " fotos esperando envio") + ".";
    }
    if (!confirm(aviso)) return;
    desconectarRota();
    state.minhaRota = "";
    state.rotaConectada = false;
    salvar("minha-rota", "");
    state.textoColado = ""; state.linhasParseadas = null; state.pacoteStatus = {};
    state.entregaInfo = {}; state.fachadaInfo = {};
    salvarSessao();
    render();
  }

  function sincronizarPacote(id) {
    if (!fbDb || !state.minhaRota || !state.linhasParseadas) return;
    var linha = state.linhasParseadas.find(function (l) { return l.id === id; });
    if (!linha || !linha.codigo) return;
    var chaveRota = sanitizarChaveFirebase(state.minhaRota);
    var st = state.pacoteStatus[id] || {};
    // O "ts" é o que permite saber, depois, de que dia é cada marcação — sem
    // ele não dava pra limpar o nó "pacotes" (ver limparPacotesAntigos).
    fbDb.ref("lotes/" + chaveRota + "/pacotes/" + linha.codigo).set({
      separado: !!st.separado, entregue: !!st.entregue, devolvido: !!st.devolvido, ts: Date.now()
    });
  }

  // "entregas" é separado por data e já era limpo depois de 2 dias, mas
  // "pacotes" não tem data no caminho: ele ia acumulando TODOS os códigos de
  // TODOS os dias da rota, pra sempre. Em ~400 pacotes/dia isso vira dezenas
  // de milhares de registros que o app rebaixa inteiros toda vez que abre —
  // fica lento e queima a franquia de download do Firebase (o plano gratuito
  // dá 10 GB/mês; estourou, o banco para de responder e a sincronização morre
  // sozinha no meio do mês).
  // Só roda num aparelho que já tem a lista de hoje carregada, e nunca
  // encosta nos códigos dessa lista nem em marcação recente de outro dia.
  function limparPacotesAntigos(chaveRota, dados) {
    if (!fbDb || !state.linhasParseadas || !dados) return;
    var deHoje = {};
    state.linhasParseadas.forEach(function (l) { if (!l.erro && l.codigo) deHoje[l.codigo] = true; });
    var limite = Date.now() - 2 * 86400000;
    var apagar = {};
    var n = 0;
    Object.keys(dados).forEach(function (codigo) {
      if (deHoje[codigo]) return;
      var ts = dados[codigo] && dados[codigo].ts;
      if (typeof ts === "number" && ts > limite) return;
      apagar[codigo] = null;
      n++;
    });
    // Uma única chamada apaga tudo de uma vez (em vez de milhares de remoções
    // separadas, que sozinhas já dariam o problema que estamos evitando).
    if (n) fbDb.ref("lotes/" + chaveRota + "/pacotes").update(apagar).catch(function () {});
  }

  function incrementarContadorGlobal() {
    if (fbDb) {
      fbDb.ref("contador_global").transaction(function (atual) { return (atual || 0) + 1; });
    } else {
      state.contadorGlobal = (state.contadorGlobal || 0) + 1;
      salvar("contador-pacotes-total", state.contadorGlobal);
    }
  }

  if (fbDb) {
    fbDb.ref("contador_global").on("value", function (snap) {
      var v = snap.val();
      if (typeof v === "number") { state.contadorGlobal = v; render(); }
    });
    fbDb.ref("rotas_registradas").on("value", function (snap) {
      var v = snap.val();
      state.totalRotas = v ? Object.keys(v).length : 0;
      render();
    });
  }
  function statusDe(id) {
    return state.pacoteStatus[id] || { separado: false, entregue: false, devolvido: false };
  }
  function marcarSeparado(id, valor) {
    if (!state.pacoteStatus[id]) state.pacoteStatus[id] = { separado: false, entregue: false, devolvido: false };
    var jaEstava = state.pacoteStatus[id].separado;
    state.pacoteStatus[id].separado = valor;
    if (valor && !jaEstava) incrementarContadorGlobal();
    sincronizarPacote(id);
    salvarSessao();
    render();
  }
  function marcarEntrega(id, campo) {
    if (!state.pacoteStatus[id]) state.pacoteStatus[id] = { separado: false, entregue: false, devolvido: false };
    var atual = state.pacoteStatus[id];
    var ligar = !atual[campo];
    atual[campo] = ligar;
    if (campo === "entregue" && ligar) atual.devolvido = false;
    if (campo === "devolvido" && ligar) atual.entregue = false;
    sincronizarPacote(id);
    salvarSessao();
    render();
  }
  function limparSessao() {
    // Ganhou confirmação porque agora também tira a lista compartilhada da
    // rota (senão, ao recarregar a página, a lista antiga voltaria da nuvem).
    // Não apaga a lista que já está aberta no celular dos outros: eles seguem
    // trabalhando até alguém organizar uma lista nova.
    var aviso = "Limpar a lista de hoje e começar um novo dia?";
    if (fbDb && state.minhaRota) aviso += "\n\nA lista compartilhada da rota " + state.minhaRota + " também sai — quem já está com ela aberta continua trabalhando normal.";
    if (!confirm(aviso)) return;
    state.textoColado = ""; state.linhasParseadas = null; state.pacoteStatus = {};
    salvarSessao();
    removerListaDaNuvem();
    render();
  }

  function baixarFotosDoDia() {
    if (!fbDb || !state.minhaRota || typeof JSZip === "undefined") return;
    var chaveRota = sanitizarChaveFirebase(state.minhaRota);
    var data = dataDeHoje();
    state.baixandoZip = true;
    render();

    Promise.all([
      fbDb.ref("lotes/" + chaveRota + "/entregas/" + data).once("value"),
      fbDb.ref("lotes/" + chaveRota + "/fachadas_permanentes").once("value")
    ]).then(function (resultados) {
      var entregas = resultados[0].val() || {};
      var fachadas = resultados[1].val() || {};
      var porChave = {};

      Object.keys(entregas).forEach(function (codigo) {
        var it = entregas[codigo];
        if (!it.chave) return;
        if (!porChave[it.chave]) porChave[it.chave] = { rua: it.rua, numero: it.numero, pacotes: [], fachadaUrl: null, quemRecebeu: "" };
        // Um pacote pode ter mais de uma foto agora (ex: loja específica
        // dentro de um shopping) — cada uma vira um arquivo no zip. O "|| []"
        // com fallback pro campo antigo "fotoPacoteUrl" é só compatibilidade
        // com fotos tiradas antes dessa atualização.
        var urlsDoPacote = it.fotos
          ? Object.keys(it.fotos).sort(function (a, b) { return (+a) - (+b); }).map(function (k) { return it.fotos[k]; })
          : (it.fotoPacoteUrl ? [it.fotoPacoteUrl] : []);
        // Prioriza quem realmente recebeu (ex: porteiro) sobre o nome do
        // destinatário da lista colada — é o que sai na foto agora.
        urlsDoPacote.forEach(function (url, slot) {
          porChave[it.chave].pacotes.push({ nome: it.quemRecebeu || it.nome || "pacote", codigo: codigo, url: url, slot: slot });
        });
        // Guarda também no nível do endereço, pra ir no nome da pasta do zip.
        if (!porChave[it.chave].quemRecebeu && it.quemRecebeu) porChave[it.chave].quemRecebeu = it.quemRecebeu;
        // Shopping: cada pacote foi recebido por uma loja diferente. Aí não
        // dá pra pôr um nome só na pasta — ela vira "VARIAS-LOJAS" e o nome
        // de quem recebeu em cada loja fica no nome de cada arquivo.
        if (it.quemRecebeu && porChave[it.chave].quemRecebeu && it.quemRecebeu !== porChave[it.chave].quemRecebeu) {
          porChave[it.chave].variasLojas = true;
        }
      });
      // "fachadas" aqui é o acervo permanente da rota inteira (todos os
      // endereços já fotografados, de qualquer dia) — só entra no zip de hoje
      // a fachada de quem também teve pacote entregue hoje (por isso não cria
      // uma pasta nova aqui, só complementa uma que já existe pelas entregas).
      Object.keys(fachadas).forEach(function (chave) {
        if (!porChave[chave]) return;
        porChave[chave].fotoFachadaUrl = fachadas[chave].fotoFachadaUrl;
      });

      var chavesOrdenadas = Object.keys(porChave).sort();
      if (chavesOrdenadas.length === 0) {
        state.baixandoZip = false;
        render();
        return;
      }

      var zip = new JSZip();
      // Largura do zero à esquerda cresce com o total de endereços do dia, pra
      // "001_", "002_"... continuar ordenando certinho mesmo se a rota (agora
      // somando você + ajudante) passar de 99 endereços num dia só.
      var digitosOrdem = Math.max(2, String(chavesOrdenadas.length).length);
      // Monta a lista de tudo que precisa baixar, já na ordem certa — mas
      // ainda sem tocar no zip. Se cada foto entrasse no zip assim que
      // terminasse de baixar (como era antes), quem tivesse conexão mais
      // rápida furava a fila e a ordem das pastas saía embaralhada (foi
      // exatamente isso: a pasta 04 baixou mais rápido que a 02 e entrou
      // antes dela no arquivo).
      var itensParaBuscar = [];
      chavesOrdenadas.forEach(function (chave, idx) {
        var g = porChave[chave];
        // Nome da pasta já sai com rua, número e quem recebeu juntos, pra na
        // hora de dar baixa no app da J&T não precisar abrir nada — só olhar
        // o nome da pasta.
        var sufixoPasta = g.variasLojas
          ? "_VARIAS-LOJAS"
          : (g.quemRecebeu ? "_" + sanitizarChaveFirebase(g.quemRecebeu).replace(/\s+/g, "-") : "");
        var nomePasta = String(idx + 1).padStart(digitosOrdem, "0") + "_" + sanitizarChaveFirebase(g.rua).replace(/\s+/g, "-") + "_" + g.numero + sufixoPasta;
        if (g.fotoFachadaUrl) {
          itensParaBuscar.push({ nomePasta: nomePasta, nomeArquivo: "fachada.jpg", url: g.fotoFachadaUrl });
        }
        g.pacotes.forEach(function (p) {
          if (!p.url) return;
          // Sempre inclui o código junto do nome: como agora vários pacotes do
          // mesmo endereço podem ficar com o mesmo "quem recebeu" (ex: vários
          // "Porteiro" na mesma pasta), o código garante que nenhum arquivo
          // sobrescreva o outro dentro do zip. Quando o próprio pacote tem
          // mais de 1 foto, a 2ª em diante ganha "_2", "_3"... no nome (a 1ª
          // fica sem sufixo, igual sempre foi).
          var nomeArq = sanitizarChaveFirebase(p.nome).replace(/\s+/g, "-") + "_" + p.codigo + (p.slot > 0 ? "_" + (p.slot + 1) : "") + ".jpg";
          itensParaBuscar.push({ nomePasta: nomePasta, nomeArquivo: nomeArq, url: p.url });
        });
      });

      // Baixa tudo em paralelo (rápido), mas só encaixa no zip DEPOIS que
      // tudo já chegou — um de cada vez, na ordem exata da lista acima. Isso
      // é o que garante a ordem certa dentro do zip, não importa qual foto
      // demorou mais ou menos pra baixar.
      Promise.all(itensParaBuscar.map(function (it) {
        return fetch(it.url).then(function (r) { return r.blob(); }).catch(function () { return null; });
      })).then(function (blobs) {
        // A ordem do nome da pasta já tava certa, mas o Google Fotos não
        // agrupa "por nome" — ele ordena os álbuns/pastas pela data da foto
        // mais recente ali dentro, e as fotos daqui não carregam data (viram
        // canvas na hora de comprimir/tirar, perdem o EXIF). Sem data própria,
        // ele cai pra data do arquivo. Aqui a gente CARIMBA essa data
        // explicitamente no zip, decrescendo uma a uma na ordem certa (a
        // primeira pasta fica com a foto "mais recente", a última com a mais
        // antiga) — é o que faz o Google Fotos (que mostra o mais recente
        // primeiro) respeitar a mesma ordem das pastas.
        var agora = Date.now();
        itensParaBuscar.forEach(function (it, i) {
          if (blobs[i]) zip.folder(it.nomePasta).file(it.nomeArquivo, blobs[i], { date: new Date(agora - i * 10000) });
        });
        return zip.generateAsync({ type: "blob" });
      }).then(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "fotos-" + chaveRota + "-" + data + ".zip";
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        state.baixandoZip = false;
        render();
      }).catch(function () {
        state.baixandoZip = false;
        render();
      });
    }).catch(function () {
      state.baixandoZip = false;
      render();
    });
  }

  function calcularResultado() {
    if (!state.linhasParseadas) return null;
    var splits = calcularSplitsPorRua();
    var validas = state.linhasParseadas.filter(function (l) { return !l.erro; });
    var erros = state.linhasParseadas.filter(function (l) { return l.erro; });
    var naoMapeadas = {};
    var porGrupo = {};

    validas.forEach(function (l) {
      var ruaMatch = encontrarRuaMapeada(l.rua, state.mapaRuas);
      if (!ruaMatch) {
        // Antes, pacote de rua fora das Faixas simplesmente SUMIA da aba Hoje:
        // não entrava em nenhuma caixa, não dava pra marcar e — o pior — não
        // entrava na conta de "separados". O contador chegava, por exemplo, em
        // "70/70" e travava ali, mesmo com 30 pacotes ainda por separar.
        // Agora eles ganham uma caixa cinza própria no fim da lista: aparecem,
        // dá pra separar, e a conta bate com o tamanho real da lista.
        naoMapeadas[l.rua] = true;
        var keySem = "SEMFAIXA|" + normalizar(l.rua);
        if (!porGrupo[keySem]) porGrupo[keySem] = { ruaNome: l.rua, label: "SEM FAIXA", cor: COR_SEM_FAIXA, itens: [], semFaixa: true };
        porGrupo[keySem].itens.push(l);
        return;
      }
      var c = classificar(l.numero, ruaMatch, splits);
      var key = ruaMatch.id + "|" + c.cor;
      if (!porGrupo[key]) porGrupo[key] = { ruaNome: ruaMatch.nome, label: c.label, cor: c.cor, itens: [] };
      porGrupo[key].itens.push(l);
    });

    var listaGrupos = Object.keys(porGrupo).map(function (k) {
      var g = porGrupo[k];
      var itens = g.itens.slice().sort(function (a, b) { return ordenarNumerico(a.numero, b.numero); });
      return { ruaNome: g.ruaNome, label: g.label, cor: g.cor, itens: itens, total: itens.length, semFaixa: !!g.semFaixa };
    }).sort(function (a, b) {
      // as caixas "sem faixa" ficam sempre no fim, pra não atrapalhar quem
      // está separando pelas cores.
      if (a.semFaixa !== b.semFaixa) return a.semFaixa ? 1 : -1;
      var rc = a.ruaNome.localeCompare(b.ruaNome, "pt-BR");
      return rc !== 0 ? rc : a.cor.localeCompare(b.cor);
    });

    // Código repetido em mais de uma linha (às vezes a própria lista vem
    // assim, de erro no sistema de quem gerou a rota) é um jeito silencioso
    // do contador "travar": ao escanear, o app sempre achava a PRIMEIRA linha
    // com aquele código — se ela já tinha sido separada, escanear as outras
    // encomendas com o mesmo código não fazia nada (nem esquenta, nem
    // esfria), então o número parava de subir mesmo com pacotes de verdade
    // ainda sendo separados. Ver processarCodigoLido pra a mudança que
    // resolve o "travar" em si — isto aqui é só o aviso pra facilitar achar
    // a causa quando for a lista.
    var porCodigo = {};
    validas.forEach(function (l) { if (l.codigo) (porCodigo[l.codigo] = porCodigo[l.codigo] || []).push(l); });
    var duplicados = Object.keys(porCodigo).filter(function (c) { return porCodigo[c].length > 1; })
      .map(function (c) { return { codigo: c, vezes: porCodigo[c].length }; });

    return { listaGrupos: listaGrupos, naoMapeadas: Object.keys(naoMapeadas), erros: erros, duplicados: duplicados };
  }

  // ---------- câmera ----------
  var streamAtual = null;
  var ultimoCodigo = { codigo: null, ts: 0 };

  function pararCamera() {
    if (streamAtual) { streamAtual.getTracks().forEach(function (t) { t.stop(); }); streamAtual = null; }
    state.statusCamera = "idle";
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && streamAtual) {
      pararCamera();
      render();
    }
    if (document.hidden && streamLote) {
      pararCameraLote();
      if (state.loteFoto) state.loteFoto.statusCamera = "idle";
      render();
    }
    if (!document.hidden) tentarReenviarFila();
  });

  window.addEventListener("online", function () {
    tentarReenviarFila();
  });

  // Bipe curto e discreto ao separar com sucesso (mesma ideia dos leitores de
  // código de barras do galpão) — sintetizado na hora (sem precisar de
  // arquivo de áudio), então funciona offline igual ao resto do app. Fica em
  // silêncio nos casos de erro (código não encontrado / sem lista), a pedido
  // do usuário. Um dos dois pode desligar sozinho no aparelho dele, sem
  // afetar o outro (fica salvo só localmente, não é uma config da rota).
  var audioCtxBipe = null;
  function tocarBipeSucesso() {
    if (!state.bipeAtivo) return;
    try {
      if (!audioCtxBipe) audioCtxBipe = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtxBipe.state === "suspended") audioCtxBipe.resume();
      var agora = audioCtxBipe.currentTime;
      var osc = audioCtxBipe.createOscillator();
      var gain = audioCtxBipe.createGain();
      osc.type = "sine";
      osc.frequency.value = 1046.5;
      gain.gain.setValueAtTime(0.0001, agora);
      gain.gain.exponentialRampToValueAtTime(0.12, agora + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, agora + 0.11);
      osc.connect(gain);
      gain.connect(audioCtxBipe.destination);
      osc.start(agora);
      osc.stop(agora + 0.12);
    } catch (e) {
      // Sem suporte a áudio ou bloqueado pelo navegador — só não bipa.
    }
  }
  function alternarBipe() {
    state.bipeAtivo = !state.bipeAtivo;
    salvar("bipe-ativo", state.bipeAtivo);
    render();
  }

  // Flash de tela cheia com a cor da faixa, por cima da câmera, logo após um
  // bipe de sucesso — pensado pra jogar o pacote direto num saco/compartimento
  // já rotulado com essa mesma cor, sem precisar ler nada, em vez de ensacar
  // tudo junto e separar de novo na rua. Some sozinho rápido pra não atrapalhar
  // o próximo escaneamento; cada novo escaneamento reinicia a contagem, então
  // nunca some "cedo demais" por causa de um flash anterior ainda correndo.
  var flashTimeoutId = null;
  function agendarFlashScan(classificacao, rua, numero) {
    if (flashTimeoutId) clearTimeout(flashTimeoutId);
    state.flashScan = { cor: classificacao.cor, label: classificacao.label, rua: rua, numero: numero };
    flashTimeoutId = setTimeout(function () {
      flashTimeoutId = null;
      state.flashScan = null;
      render();
    }, 800);
  }

  function processarCodigoLido(codigo) {
    var agora = Date.now();
    if (ultimoCodigo.codigo === codigo && agora - ultimoCodigo.ts < 2500) return;
    ultimoCodigo = { codigo: codigo, ts: agora };

    if (!state.linhasParseadas) { state.resultadoScan = { encontrado: false, semLista: true, codigo: codigo }; render(); return; }
    // Quando o mesmo código aparece em mais de uma linha (lista com código
    // repetido — ver aviso em calcularResultado), escanear sempre pegava a
    // PRIMEIRA linha daquele código. Se ela já tinha sido separada antes,
    // escanear as próximas encomendas com esse mesmo código não fazia nada:
    // nem erro, nem separação nova — o contador simplesmente parava de subir
    // mesmo com pacotes de verdade passando pela câmera. Agora prefere uma
    // linha AINDA NÃO separada daquele código (se houver uma), então cada
    // encomenda física com o código repetido avança uma linha diferente em
    // vez de martelar sempre a mesma.
    var candidatas = state.linhasParseadas.filter(function (l) { return !l.erro && l.codigo && l.codigo === codigo; });
    if (!candidatas.length) { state.resultadoScan = { encontrado: false, codigo: codigo }; render(); return; }
    var linha = candidatas.find(function (l) { return !statusDe(l.id).separado; }) || candidatas[0];

    var ruaMatch = encontrarRuaMapeada(linha.rua, state.mapaRuas);
    var classificacao = ruaMatch ? classificar(linha.numero, ruaMatch, calcularSplitsPorRua()) : null;
    state.resultadoScan = { encontrado: true, rua: linha.rua, numero: linha.numero, nome: linha.nome, classificacao: classificacao };
    tocarBipeSucesso();
    if (classificacao) agendarFlashScan(classificacao, linha.rua, linha.numero);
    marcarSeparado(linha.id, true);
  }

  function iniciarCamera() {
    // Mesma ideia da câmera em lote: solta qualquer câmera presa antes de
    // pedir esta, pra não disputar o hardware com uma câmera que ficou aberta.
    if (streamLote) pararCameraLote();
    state.statusCamera = "pedindo"; state.erroCamera = ""; state.resultadoScan = null; render();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      state.statusCamera = "erro"; state.erroCamera = "esse navegador não expõe acesso à câmera aqui."; render(); return;
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
    }).then(function (stream) {
      streamAtual = stream;
      state.statusCamera = ("BarcodeDetector" in window) ? "ativa" : "sem-suporte";
      render();
      var video = document.getElementById("video");
      if (video) {
        video.srcObject = stream;
        video.play().catch(function () {});
      }
      if (!("BarcodeDetector" in window)) return;
      var detector = new BarcodeDetector();
      function tick() {
        if (!streamAtual) return;
        var v = document.getElementById("video");
        if (!v) { requestAnimationFrame(tick); return; }
        detector.detect(v).then(function (codes) {
          if (codes.length > 0) processarCodigoLido(codes[0].rawValue);
        }).catch(function () {});
        requestAnimationFrame(tick);
      }
      tick();
    }).catch(function (e) {
      state.statusCamera = "erro";
      if (e.name === "NotReadableError") {
        state.erroCamera = "a c\u00e2mera parece estar em uso por outro app ou aba. Feche outros apps que usem c\u00e2mera (ou feche e abra o navegador de novo) e tente de novo. Detalhe t\u00e9cnico: " + e.message;
      } else if (e.name === "NotFoundError" || e.name === "OverconstrainedError") {
        state.erroCamera = "n\u00e3o encontrei nenhuma c\u00e2mera dispon\u00edvel nesse aparelho. Detalhe t\u00e9cnico: " + e.message;
      } else {
        state.erroCamera = "permiss\u00e3o negada ou bloqueada pelo ambiente. Detalhe t\u00e9cnico: " + e.message;
      }
      render();
    });
  }

  // Overlay simples por cima da tela atual (não substitui o app.innerHTML
  // inteiro como o loteFoto) — assim fechar não mexe no scroll da lista por
  // baixo.
  function renderVisualizadorFoto() {
    if (!state.fotoVisualizando) return "";
    var urls = state.fotoVisualizando.urls || [];
    // Pacote com mais de 1 foto (ex: pacote + fachada da loja específica)
    // mostra as duas empilhadas, com rolagem se precisar — "Apagar" some
    // com todas de uma vez (ver comentário em apagarFotoPacote).
    var imgs = urls.map(function (u) {
      return '<img src="' + u + '" style="max-width:100%;max-height:' + (urls.length > 1 ? "38vh" : "70vh") + ';border-radius:8px;object-fit:contain" />';
    }).join("");
    return '<div style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px">' +
      '<div style="display:flex;flex-direction:column;gap:10px;max-height:78vh;overflow-y:auto;align-items:center">' + imgs + '</div>' +
      '<div style="display:flex;gap:10px">' +
      '<button data-action="fechar-foto-visualizando" class="pill" style="background:#fff;color:#000">Fechar</button>' +
      '<button data-action="apagar-foto-visualizando" class="pill" style="background:var(--alert);color:#fff">\u{1F5D1}️ Apagar ' + (urls.length > 1 ? "as " + urls.length + " fotos" : "foto") + '</button>' +
      "</div></div>";
  }

  // ---------- render ----------
  function setAba(a) {
    if (state.aba !== a) {
      if (streamAtual) pararCamera();
      state.resultadoScan = null;
      state.flashScan = null;
      if (flashTimeoutId) { clearTimeout(flashTimeoutId); flashTimeoutId = null; }
    }
    state.aba = a;
    render();
  }

  function render() {
    var app = document.getElementById("app");

    if (state.loteFoto) {
      app.innerHTML = renderLoteFoto();
      attachHandlersLote();
      var vLote = document.getElementById("videoLote");
      if (vLote && streamLote && vLote.srcObject !== streamLote) {
        vLote.srcObject = streamLote;
        vLote.play().catch(function () {});
      }
      return;
    }

    var html = "";

    var contadorAtivo = !!state.rotaConectada;
    html += '<header><div class="titlerow"><span style="font-size:22px">\u{1F4E6}</span><h1>Simplificando as Entregas</h1></div>' +
      '<p style="font-size:12px;opacity:.6;margin:2px 0 0">' + formatarNumero(state.contadorGlobal || 0) + " \u00b7 " +
      (contadorAtivo ? "Todos os pacotes processados no galp\u00e3o" : "Pacotes processados neste aparelho") +
      "</p>" +
      (state.filaPendente.length > 0 ? '<p style="font-size:12px;margin:4px 0 0;color:var(--accent-deep);font-weight:600">\u23f3 ' + state.filaPendente.length + " " + plural(state.filaPendente.length, "foto pendente de envio", "fotos pendentes de envio") + "</p>" : "") +
      "</header>";

    html += '<div class="tabs">' +
      tabBtn("escanear", "\u{1F4F7} C\u00e2mera") +
      tabBtn("separar", "\u{1F4E6} Hoje") + tabBtn("mapa", "\u{1F4CD} Faixas") + '</div>';

    if (state.aba === "separar" && state.linhasParseadas) {
      html += '<button class="btn-primary" data-action="limpar-sessao" style="background:transparent;border:1px solid var(--line);color:var(--ink);opacity:.7;margin:10px 0 14px">\u21bb Limpar e come\u00e7ar novo dia</button>';
    }

    if (state.aba === "escanear") html += renderCamera();
    else if (state.aba === "separar") html += renderSeparar();
    else if (state.aba === "mapa") html += renderMapa();

    html += renderVisualizadorFoto();

    app.innerHTML = html;

    attachHandlers();
    if (state.aba === "escanear" && streamAtual) {
      var v2 = document.getElementById("video");
      if (v2 && v2.srcObject !== streamAtual) {
        v2.srcObject = streamAtual;
        v2.play().catch(function () {});
      }
    }

    // Volta o scroll pro pacote/endereço onde a foto foi tirada, em vez de
    // deixar a lista voltar pro topo (só usa uma vez e descarta — ver
    // comentário perto de "definirFoco").
    if (focoAncora) {
      var idFoco = focoAncora;
      focoAncora = null;
      salvar("foco-ancora", null);
      var elFoco = document.getElementById(idFoco);
      if (elFoco) elFoco.scrollIntoView({ block: "center" });
    }
  }

  function tabBtn(id, label) {
    return '<button class="tab' + (state.aba === id ? " active" : "") + '" data-tab="' + id + '">' + label + "</button>";
  }

  function renderLoteFoto() {
    var lote = state.loteFoto;
    var ehFachada = lote.tipo === "fachada";
    var chaveLote = ehFachada ? "" : chaveOrdenavel(lote.ruaNome, lote.numero);
    var lojaPorLojaLote = !ehFachada && lote.itens.length > 1 && enderecoEhIndividual(chaveLote, lote.itens);
    var quemRecebeuLote = "";
    for (var qi = 0; qi < lote.itens.length; qi++) {
      var qv = (state.entregaInfo[lote.itens[qi].id] && state.entregaInfo[lote.itens[qi].id].quemRecebeu) || "";
      if (qv) { quemRecebeuLote = qv; break; }
    }
    var itensComFoto = ehFachada ? 0 : lote.itens.filter(function (_, idx) {
      return lote.fotos.some(function (f) { return f.itemIdx === idx; });
    }).length;
    var infoLinha = ehFachada
      ? (lote.fotos.length > 0 ? "foto pronta pra enviar" : "tire 1 foto da fachada do prédio")
      : (itensComFoto + '/' + lote.itens.length + ' pacotes com foto · ' + lote.fotos.length + ' ' + plural(lote.fotos.length, "foto tirada", "fotos tiradas"));
    var html = '<div style="padding:24px 0">';
    html += '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:8px">' +
      '<div><p style="font-weight:700;font-size:15px;margin:0">' + esc(lote.ruaNome) + ' · nº ' + esc(lote.numero) + (ehFachada ? " · fachada" : "") + '</p>' +
      '<p style="font-size:12px;opacity:.65;margin:2px 0 0">' + infoLinha + '</p></div>' +
      '<button data-action="cancelar-lote" style="border:none;background:none;font-size:22px;color:var(--ink);opacity:.6;cursor:pointer;flex-shrink:0">✕</button></div>';

    if (!ehFachada && lote.itens.length > 1) {
      // Dá pra virar a chave aqui dentro também: normalmente é na hora de
      // fotografar que se percebe que aquele número é shopping.
      html += '<button data-action="alternar-individual-lote" data-chave="' + chaveLote + '" class="pill' + (lojaPorLojaLote ? " ativo-entregue" : "") + '" style="margin-bottom:10px">' +
        (lojaPorLojaLote ? "\ud83c\udfea Loja por loja" : "\ud83c\udfe2 Um nome pra todos") + "</button>";
    }
    if (!ehFachada && !lojaPorLojaLote) {
      // Prédio: um nome só (o porteiro) vale pro número inteiro — ninguém
      // confere nome por nome na portaria. Fachada não pergunta isso.
      html += '<input id="quemRecebeuLoteInput" value="' + esc(quemRecebeuLote) + '" placeholder="Quem recebeu esse lote? (ex: porteiro)" style="width:100%;font-size:13px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:var(--paper-light);margin-bottom:12px;box-sizing:border-box" />';
    }

    if (lote.statusCamera === "pedindo") {
      html += '<p class="muted" style="text-align:center;padding:16px 0">pedindo acesso à câmera...</p>';
    } else if (lote.statusCamera === "erro") {
      html += '<div class="warn-box">' + esc(lote.erro) + '</div>' +
        '<button data-action="reativar-camera-lote" class="btn-primary" style="margin-top:8px">Tentar de novo</button>';
    } else if (lote.statusCamera === "idle") {
      html += '<div class="warn-box">câmera pausada (o app ficou em segundo plano).</div>' +
        '<button data-action="reativar-camera-lote" class="btn-primary" style="margin-top:8px">▶️ Reativar câmera</button>';
    }

    html += '<video id="videoLote" playsinline autoplay muted style="display:' + (lote.statusCamera === "ativa" ? "block" : "none") + '"></video>';

    if (lote.statusCamera === "ativa") {
      if (ehFachada) {
        // Fachada é só 1 foto — depois de tirada, o obturador some (pra ver
        // de novo é só apagar a miniatura, que ele volta).
        if (lote.fotos.length === 0) {
          html += '<button data-action="tirar-foto-lote" class="btn-primary" style="margin-top:12px;font-size:16px;padding:16px">📸 Tirar foto da fachada</button>';
        }
      } else {
        var proxIdx = proximoItemIdxLote(lote);
        var ultimoIdx = ultimoItemIdxLote(lote);
        // Botão de cima = foto do PACOTE do próximo nome da lista. Ele fica
        // sempre no mesmo lugar pra prédio comum continuar sendo "toca, toca,
        // toca" (1 foto por pacote, sem toque a mais).
        if (proxIdx !== null) {
          html += '<button data-action="tirar-foto-lote" class="btn-primary" style="margin-top:12px;font-size:16px;padding:15px 16px;text-align:left">📦 Foto do pacote \u00b7 ' +
            esc(cortarNome(nomeItemLote(lote.itens[proxIdx], proxIdx), 26)) +
            '<span style="display:block;font-size:11px;font-weight:400;opacity:.75;margin-top:3px">' + (proxIdx + 1) + ' de ' + lote.itens.length + ' desse número</span></button>';
        }
        // Botão de baixo = a 2ª foto do MESMO nome que acabou de ser
        // fotografado (a frente da loja dele, no caso de shopping). É o par
        // que o Sérgio pediu: foto do pacote seguida da foto da loja, nome
        // por nome. Só aparece depois que já existe a foto do pacote.
        if (ultimoIdx !== null) {
          var qtdUlt = fotosDoItemLote(lote, ultimoIdx);
          var nomeUlt = esc(cortarNome(nomeItemLote(lote.itens[ultimoIdx], ultimoIdx), 26));
          html += '<button data-action="tirar-foto-extra-lote" class="btn-primary" style="margin-top:8px;font-size:15px;padding:14px 16px;text-align:left;background:var(--accent-deep)">🏪 ' +
            (qtdUlt === 1 ? 'Frente da loja \u00b7 ' : 'Mais uma foto \u00b7 ') + nomeUlt +
            '<span style="display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:3px">' +
            (qtdUlt === 1 ? 'mesma pessoa da foto anterior \u2014 fica com 2 fotos' : 'esse nome já está com ' + qtdUlt + ' fotos') +
            '</span></button>';
        }
      }
    }

    // Conferência rápida por NOME: quem desse número já está com foto e
    // quantas. Num shopping é isso que diz "a loja do Bruno já tá com as 2".
    if (!ehFachada && lote.itens.length > 1) {
      html += '<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">';
      lote.itens.forEach(function (linha, idx) {
        var n = fotosDoItemLote(lote, idx);
        html += '<div style="padding:' + (lojaPorLojaLote ? "6px 0 10px" : "3px 0") + ';opacity:' + (n ? "1" : ".55") + '">' +
          '<div style="display:flex;justify-content:space-between;gap:10px;font-size:12px">' +
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (idx + 1) + '. ' + esc(nomeItemLote(linha, idx)) + '</span>' +
          '<span style="flex-shrink:0;font-weight:700;color:' + (n >= 2 ? "var(--ok)" : "var(--ink)") + '">' + (n ? "\ud83d\udcf7 " + n : "sem foto") + '</span></div>' +
          // Num shopping, quem assina é a pessoa daquela loja: o campo fica
          // junto do nome dela, aqui mesmo na câmera, pra preencher na hora
          // da entrega sem ter que voltar pra lista.
          (lojaPorLojaLote
            ? '<input data-action="quem-recebeu-lote-item" data-id="' + linha.id + '" value="' + esc((state.entregaInfo[linha.id] && state.entregaInfo[linha.id].quemRecebeu) || "") + '" placeholder="Quem recebeu nessa loja" style="width:100%;box-sizing:border-box;margin-top:5px;font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:var(--paper-light)" />'
            : "") +
          '</div>';
      });
      html += '</div>';
    }

    if (lote.fotos.length > 0) {
      html += '<div style="display:flex;gap:8px;overflow-x:auto;padding:14px 0">';
      lote.fotos.forEach(function (f, idx) {
        var pacoteDaFoto = ehFachada ? null : lote.itens[f.itemIdx];
        var ehExtra = !ehFachada && lote.fotos.slice(0, idx).some(function (x) { return x.itemIdx === f.itemIdx; });
        // Agora a legenda mostra o NOME (num shopping, o nome é a loja) e se
        // aquela foto é a do pacote ou a da frente da loja.
        var legenda = ehFachada ? "fachada" : (pacoteDaFoto ? (cortarNome(nomeItemLote(pacoteDaFoto, f.itemIdx), 14) + " · " + (ehExtra ? "loja" : "pacote")) : "extra");
        html += '<div style="position:relative;flex-shrink:0;text-align:center">' +
          '<img src="' + f.previewUrl + '" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block" />' +
          '<button data-action="remover-foto-lote" data-idx="' + idx + '" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--alert);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer">✕</button>' +
          '<p style="font-size:9px;opacity:.6;margin:3px 0 0;width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(legenda) + '</p></div>';
      });
      html += '</div>';
    }

    html += '<button data-action="enviar-lote" class="btn-primary" style="margin-top:8px"' + (lote.fotos.length === 0 ? " disabled" : "") + '>' +
      '✅ ' + (ehFachada ? "Enviar foto da fachada" : "Enviar " + lote.fotos.length + " " + plural(lote.fotos.length, "foto", "fotos")) + '</button>';
    html += '</div>';
    return html;
  }

  function attachHandlersLote() {
    var app = document.getElementById("app");
    var quemRecebeuLoteInput = document.getElementById("quemRecebeuLoteInput");
    if (quemRecebeuLoteInput && state.loteFoto) {
      var loteRuaNome = state.loteFoto.ruaNome, loteNumero = state.loteFoto.numero;
      quemRecebeuLoteInput.oninput = function () { aplicarQuemRecebeuEndereco(loteRuaNome, loteNumero, quemRecebeuLoteInput.value, false); };
      quemRecebeuLoteInput.onblur = function () { aplicarQuemRecebeuEndereco(loteRuaNome, loteNumero, quemRecebeuLoteInput.value, true); };
    }
    app.querySelectorAll('[data-action="quem-recebeu-lote-item"]').forEach(function (el) {
      var id = el.getAttribute("data-id");
      el.oninput = function () {
        if (!state.entregaInfo[id]) state.entregaInfo[id] = {};
        state.entregaInfo[id].quemRecebeu = el.value;
      };
      el.onblur = function () { salvarQuemRecebeu(id, el.value); };
    });
    var alternarLoteBtn = app.querySelector('[data-action="alternar-individual-lote"]');
    if (alternarLoteBtn && state.loteFoto) {
      var loteRua = state.loteFoto.ruaNome, loteNum = state.loteFoto.numero;
      alternarLoteBtn.onclick = function () {
        alternarEnderecoIndividual(alternarLoteBtn.getAttribute("data-chave"), loteRua, loteNum);
      };
    }
    var cancelarBtn = app.querySelector('[data-action="cancelar-lote"]');
    if (cancelarBtn) cancelarBtn.onclick = cancelarLoteFoto;
    var reativarBtn = app.querySelector('[data-action="reativar-camera-lote"]');
    if (reativarBtn) reativarBtn.onclick = iniciarCameraLote;
    var tirarBtn = app.querySelector('[data-action="tirar-foto-lote"]');
    if (tirarBtn) tirarBtn.onclick = function () { tirarFotoLote("novo"); };
    var tirarExtraBtn = app.querySelector('[data-action="tirar-foto-extra-lote"]');
    if (tirarExtraBtn) tirarExtraBtn.onclick = function () { tirarFotoLote("extra"); };
    var enviarBtn = app.querySelector('[data-action="enviar-lote"]');
    if (enviarBtn) enviarBtn.onclick = enviarLoteFoto;
    app.querySelectorAll('[data-action="remover-foto-lote"]').forEach(function (el) {
      el.onclick = function () { removerFotoLote(parseInt(el.getAttribute("data-idx"), 10)); };
    });
  }

  function renderFlashScan() {
    if (!state.flashScan) return "";
    var f = state.flashScan;
    var corTexto = corTextoParaHex(f.cor);
    return '<div style="position:fixed;inset:0;background:' + f.cor + ';z-index:1200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none">' +
      '<p style="font-size:60px;font-weight:800;margin:0;color:' + corTexto + '">' + f.label + '</p>' +
      '<p style="font-size:20px;font-weight:600;margin:0;color:' + corTexto + ';opacity:.9">' + esc(f.rua) + ' · nº ' + esc(f.numero) + '</p>' +
      "</div>";
  }

  function renderCamera() {
    if (!state.linhasParseadas) {
      return '<div class="warn-box">Carregue a lista do dia na aba "Hoje" primeiro \u2014 \u00e9 dela que vem o n\u00famero de cada pacote.</div>';
    }
    var html = '<div style="display:flex;justify-content:flex-end;margin-bottom:8px">' +
      '<button data-action="alternar-bipe" class="pill' + (state.bipeAtivo ? " ativo-entregue" : "") + '">' +
      (state.bipeAtivo ? "\ud83d\udd0a Bipe ligado" : "\ud83d\udd07 Bipe desligado") + '</button></div>';
    if (state.statusCamera === "idle") {
      html += '<button class="btn-primary" data-action="iniciar-camera">\u{1F4F7} iniciar c\u00e2mera</button>';
    } else if (state.statusCamera === "pedindo") {
      html += '<p class="muted" style="text-align:center;padding:16px 0">pedindo acesso \u00e0 c\u00e2mera...</p>';
    } else if (state.statusCamera === "erro") {
      html += '<div class="warn-box">' + esc(state.erroCamera) + "</div>";
    } else if (state.statusCamera === "sem-suporte") {
      html += '<div class="warn-box">A c\u00e2mera ligou, mas esse navegador n\u00e3o tem leitor nativo de QR/c\u00f3digo de barras.</div>';
    }
    html += '<video id="video" playsinline autoplay muted style="display:' + (state.statusCamera === "ativa" ? "block" : "none") + '"></video>';

    if (state.resultadoScan) {
      var r = state.resultadoScan;
      if (r.encontrado && r.classificacao) {
        var c = r.classificacao;
        html += '<div class="result-color" style="margin-top:12px;background:' + c.cor + '">' +
          '<p style="font-size:32px;font-weight:700;margin:0 0 10px;color:' + corTextoParaHex(c.cor) + '">' + c.label + '</p>' +
          '<p style="font-size:16px;font-weight:600;margin:0;color:' + corTextoParaHex(c.cor) + ';opacity:.9">' + esc(r.rua) + ' \u00b7 n\u00ba ' + esc(r.numero) + (r.nome ? " \u00b7 " + esc(r.nome) : "") + '</p></div>';
      } else if (r.encontrado) {
        html += '<div class="result-warn" style="margin-top:12px">Achei o pacote (' + esc(r.rua) + ", n\u00ba " + esc(r.numero) + ") mas essa rua n\u00e3o est\u00e1 cadastrada.</div>";
      } else {
        html += '<div class="result-warn" style="margin-top:12px">' + (r.semLista ? "carregue a lista do dia primeiro." : 'c\u00f3digo "' + esc(r.codigo) + '" n\u00e3o encontrado na lista de hoje.') + "</div>";
      }
    }
    html += renderFlashScan();
    return html;
  }

  function renderResumoBar(resultado) {
    var todos = [];
    resultado.listaGrupos.forEach(function (g) { todos = todos.concat(g.itens); });
    var total = todos.length;
    var separados = todos.filter(function (it) { return statusDe(it.id).separado; }).length;

    var html = '<div class="card" style="padding:10px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:14px">' +
      "<span><strong>" + total + "</strong> " + plural(total, "pacote", "pacotes") + " \u00b7 <strong>" + resultado.listaGrupos.length + "</strong> " + plural(resultado.listaGrupos.length, "cor", "cores") + "</span>" +
      '<span style="color:var(--ok);font-weight:600">' + separados + "/" + total + " separados</span></div>";
    return html;
  }

  function renderListaGrupos(resultado) {
    var html = "";
    resultado.listaGrupos.forEach(function (g) {
      var separadosNaCaixa = g.itens.filter(function (it) { return statusDe(it.id).separado; }).length;
      html += '<div class="card" style="overflow:hidden;margin-bottom:12px">' +
        '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:' + g.cor + '">' +
        '<span style="font-size:14px;font-weight:700;flex:1;color:' + corTextoParaHex(g.cor) + '">' + g.label + " \u00b7 " + esc(g.ruaNome) + "</span>" +
        '<span style="font-size:11px;font-family:ui-monospace,monospace;color:' + corTextoParaHex(g.cor) + ';opacity:.85">' + separadosNaCaixa + "/" + g.total + "</span></div><ul style='list-style:none;margin:0;padding:0'>";

      var contagemPorNumero = {};
      g.itens.forEach(function (it) { contagemPorNumero[it.numero] = (contagemPorNumero[it.numero] || 0) + 1; });

      g.itens.forEach(function (item, idx) {
        var st = statusDe(item.id);
        var qtdMesmoNumero = contagemPorNumero[item.numero];
        var primeiroDoNumero = idx === 0 || g.itens[idx - 1].numero !== item.numero;
        var chaveEndereco = chaveOrdenavel(g.ruaNome, item.numero);
        var temFachada = !!state.fachadaInfo[chaveEndereco];
        var fachadaPendente = !temFachada && fachadaPendenteFila(chaveEndereco);

        if (primeiroDoNumero) {
          var itensDoEndereco = g.itens.filter(function (it) { return it.numero === item.numero; });
          var semFotoNoEndereco = itensDoEndereco.filter(function (it) {
            return !temFotoPacote(it.id) && !pacotePendenteFila(it.id);
          }).length;
          var quemRecebeuEndereco = "";
          for (var qi = 0; qi < itensDoEndereco.length; qi++) {
            var qv = (state.entregaInfo[itensDoEndereco[qi].id] && state.entregaInfo[itensDoEndereco[qi].id].quemRecebeu) || "";
            if (qv) { quemRecebeuEndereco = qv; break; }
          }
          var lojaPorLoja = qtdMesmoNumero > 1 && enderecoEhIndividual(chaveEndereco, itensDoEndereco);
          html += '<li id="endereco-' + chaveEndereco + '" style="padding:7px 12px;background:var(--paper-deep);border-top:1px solid var(--line);list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
            '<span style="flex:1"><span style="font-size:16px;font-weight:700">n\u00ba ' + esc(item.numero) + "</span>" +
            (qtdMesmoNumero > 1 ? '<span style="font-size:14px;font-weight:700;color:var(--accent-deep)"> \u00b7 ' + qtdMesmoNumero + " pacotes</span>" : "") + "</span>" +
            (qtdMesmoNumero > 1 && semFotoNoEndereco > 0 ? '<button data-action="foto-lote" data-rua="' + esc(g.ruaNome) + '" data-numero="' + esc(item.numero) + '" class="pill">\u{1F4F7} Todas (' + semFotoNoEndereco + ')</button>' : "") +
            (temFachada
              ? '<button data-action="ver-foto-fachada" data-chave="' + chaveEndereco + '" class="pill ativo-entregue">\u2713 Fachada</button>' +
                '<button data-action="apagar-fachada" data-chave="' + chaveEndereco + '" class="pill" style="background:var(--alert);color:#fff">\ud83d\uddd1\ufe0f</button>'
              : '<button data-action="foto-fachada" data-chave="' + chaveEndereco + '" data-rua="' + esc(g.ruaNome) + '" data-numero="' + esc(item.numero) + '" class="pill' + (fachadaPendente ? " ativo-pendente" : "") + '">' +
                (fachadaPendente ? "\u23f3" : "\u{1F4F7}") + " Fachada</button>") +
            (qtdMesmoNumero > 1
              ? '<button data-action="alternar-individual" data-chave="' + chaveEndereco + '" data-rua="' + esc(g.ruaNome) + '" data-numero="' + esc(item.numero) + '" class="pill' + (lojaPorLoja ? " ativo-entregue" : "") + '">' +
                (lojaPorLoja ? "\ud83c\udfea Loja por loja" : "\ud83c\udfe2 Um nome pra todos") + "</button>"
              : "") +
            // Shopping: cada loja tem quem assina; o campo do endereço sai de
            // cena e cada pacote ganha o seu, logo abaixo do nome dele.
            (lojaPorLoja
              ? '<p style="flex:1 1 100%;font-size:11px;margin:2px 0 0;opacity:.6">cada pacote desse número tem o seu campo de quem recebeu, embaixo do nome</p>'
              : '<input data-action="quem-recebeu-endereco" data-rua="' + esc(g.ruaNome) + '" data-numero="' + esc(item.numero) + '" value="' + esc(quemRecebeuEndereco) + '" placeholder="Quem recebeu ' + (qtdMesmoNumero === 1 ? "esse pacote" : "esses " + qtdMesmoNumero + " pacotes") + ' (ex: porteiro)" style="flex:1 1 100%;font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:var(--paper-light)" />') +
            "</li>";
        }

        var itensDesteNumero = g.itens.filter(function (it) { return it.numero === item.numero; });
        var lojaPorLojaAtual = qtdMesmoNumero > 1 && enderecoEhIndividual(chaveEndereco, itensDesteNumero);
        var qtdFotosPacote = fotosDoPacote(item.id).length;
        var jaTemFoto = qtdFotosPacote > 0;
        var fotoPacotePendente = !jaTemFoto && pacotePendenteFila(item.id);
        var recuo = qtdMesmoNumero > 1 ? "8px 12px 8px 26px" : "8px 12px";
        // Uma vez com foto confirmada, o \u00edcone vira "ver a foto" em vez de
        // reabrir a c\u00e2mera \u2014 pra retirar, usa o bot\u00e3o de apagar ao lado (ou
        // dentro da pr\u00f3pria visualiza\u00e7\u00e3o), e s\u00f3 depois de apagada o \u00edcone
        // volta a abrir a c\u00e2mera pra uma foto nova. Sempre usa a c\u00e2mera ao
        // vivo do "Todas" (j\u00e1 pede quem recebeu) \u2014 n\u00e3o tem mais c\u00e2mera
        // nativa aqui, com endere\u00e7o de 1 ou v\u00e1rios pacotes.
        var botaoFoto;
        if (jaTemFoto) {
          botaoFoto = '<button data-action="ver-foto-pacote" data-id="' + item.id + '" class="pill ativo-entregue">\u2713 Foto' + (qtdFotosPacote > 1 ? " (" + qtdFotosPacote + ")" : "") + '</button>' +
            '<button data-action="apagar-foto-pacote" data-id="' + item.id + '" class="pill" style="background:var(--alert);color:#fff">\ud83d\uddd1\ufe0f</button>';
        } else {
          botaoFoto = '<button data-action="foto-lote" data-rua="' + esc(g.ruaNome) + '" data-numero="' + esc(item.numero) + '" class="pill' + (fotoPacotePendente ? " ativo-pendente" : "") + '">' +
            (fotoPacotePendente ? "\u23f3" : "\u{1F4F7}") + " Foto</button>";
        }
        html += '<li id="pacote-' + item.id + '" style="padding:' + recuo + ';border-top:1px solid var(--line)">' +
          '<div data-action="toggle-separado" data-id="' + item.id + '" style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;margin-bottom:8px">' +
          '<span class="checkbox' + (st.separado ? " done" : "") + '">' + (st.separado ? "\u2713" : "") + "</span>" +
          '<span' + (st.separado ? ' class="nome-separado"' : "") + ">" + (qtdMesmoNumero > 1 ? esc(item.nome || "sem nome") : "n\u00ba " + esc(item.numero) + (item.nome ? " \u00b7 " + esc(item.nome) : "")) + "</span></div>" +
          '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
          botaoFoto +
          "</div>" +
          // Modo "loja por loja": o nome de quem recebeu é desta loja, não do
          // número inteiro — por isso o campo fica aqui, colado no nome do
          // pacote, e grava só nele.
          (lojaPorLojaAtual
            ? '<input data-action="quem-recebeu" data-id="' + item.id + '" value="' + esc((state.entregaInfo[item.id] && state.entregaInfo[item.id].quemRecebeu) || "") + '" placeholder="Quem recebeu ' + (item.nome ? "em " + esc(cortarNome(String(item.nome).trim(), 18)) : "esse pacote") + '" style="width:100%;box-sizing:border-box;margin-top:8px;font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:var(--paper-light)" />'
            : "") +
          "</li>";
      });
      html += "</ul></div>";
    });
    return html;
  }

  function renderSeparar() {
    var html = "";
    if (!state.linhasParseadas) {
      html += '<div class="card" style="padding:12px;font-size:12px;line-height:1.5;margin-bottom:12px">' +
        '<p style="font-weight:600;margin:0 0 4px">Cole 1 pacote por linha:</p>' +
        '<p style="font-family:ui-monospace,monospace;opacity:.7;margin:2px 0">Rua, N\u00famero, Nome, C\u00f3digo (nome e c\u00f3digo s\u00e3o opcionais)</p>' +
        '<p style="font-family:ui-monospace,monospace;opacity:.5;margin:2px 0">Rua Mariz e Barros, 501, Anne Elise, 888030883495876</p></div>' +
        '<textarea id="textoColado" class="card" rows="10" placeholder="Rua Ator Paulo Gustavo, 72, Jo\u00e3o Silva, 888030883491111' + "\n" + 'Rua Mariz e Barros, 501, Anne Elise, 888030883495555" style="width:100%;font-size:14px;font-family:ui-monospace,monospace;padding:12px;margin-bottom:12px;color:var(--ink)">' + esc(state.textoColado) + "</textarea>" +
        '<button class="btn-primary" data-action="organizar"' + (!state.textoColado.trim() ? " disabled" : "") + ">Organizar pacotes</button>";
      return html;
    }

    var resultado = calcularResultado();
    html += renderResumoBar(resultado);

    if (state.filaPendente.length > 0) {
      html += '<button data-action="reenviar-pendentes" class="btn-primary" style="margin-bottom:12px;background:var(--accent);color:var(--ink)"' + (state.enviandoFila ? " disabled" : "") + ">" +
        (state.enviandoFila ? "Reenviando..." : "⏳ " + state.filaPendente.length + " " + plural(state.filaPendente.length, "foto pendente", "fotos pendentes") + " — tentar agora") +
        "</button>";
    }

    if (cloudinaryPronto && state.minhaRota) {
      html += '<button data-action="baixar-zip" class="btn-primary" style="margin-bottom:12px"' + (state.baixandoZip ? " disabled" : "") + ">" +
        (state.baixandoZip ? "Preparando o zip..." : "\u{1F4E5} Baixar fotos de hoje (zip, em ordem)") + "</button>";
    }

    if (resultado.naoMapeadas.length > 0) {
      html += '<div class="warn-box" style="margin-bottom:12px"><strong>ruas ainda sem faixa:</strong> ' + resultado.naoMapeadas.map(esc).join(", ") +
        ' \u2014 esses pacotes est\u00e3o nas caixas cinza no fim da lista (contam normal). Cadastre na aba "Faixas" pra eles ganharem cor.</div>';
    }

    if (resultado.erros.length > 0) {
      html += '<details class="muted" style="margin-bottom:12px;font-size:12px"><summary style="cursor:pointer">' + resultado.erros.length + " " + plural(resultado.erros.length, "linha n\u00e3o reconhecida", "linhas n\u00e3o reconhecidas") + "</summary><ul style='margin-top:4px;padding-left:18px'>" +
        resultado.erros.map(function (e) { return "<li style='font-family:ui-monospace,monospace'>" + esc(e.raw) + "</li>"; }).join("") + "</ul></details>";
    }

    if (resultado.duplicados.length > 0) {
      html += '<details class="warn-box" style="margin-bottom:12px;font-size:12px"><summary style="cursor:pointer;font-weight:600">' + resultado.duplicados.length + " " + plural(resultado.duplicados.length, "c\u00f3digo repetido", "c\u00f3digos repetidos") + " na lista \u2014 pode ser a causa do contador n\u00e3o subir ao escanear</summary><ul style='margin-top:4px;padding-left:18px'>" +
        resultado.duplicados.map(function (d) { return "<li style='font-family:ui-monospace,monospace'>" + esc(d.codigo) + " \u2014 aparece " + d.vezes + " vezes</li>"; }).join("") + "</ul></details>";
    }

    html += renderListaGrupos(resultado);
    return html;
  }

  function renderMapa() {
    var statusTexto = !fbDb
      ? "sem conex\u00e3o com o Firebase \u2014 tudo funciona s\u00f3 neste aparelho."
      : !state.minhaRota
      ? "defina seu c\u00f3digo pra compartilhar o progresso com quem mais estiver nessa rota."
      : state.rotaConectada
      ? "conectado \u2014 compartilhando com quem usar esse mesmo c\u00f3digo."
      : "sem conex\u00e3o em tempo real agora (funcionando localmente).";
    var statusCor = (fbDb && state.minhaRota && state.rotaConectada) ? "var(--ok)" : "var(--alert)";

    var html = '<div class="card" style="padding:12px;margin-bottom:16px">' +
      '<p style="font-size:11px;font-weight:600;margin:0 0 6px;opacity:.65">C\u00d3DIGO DA SUA ROTA</p>' +
      '<div style="display:flex;gap:8px">' +
      '<input id="minhaRotaInput" value="' + esc(state.minhaRota) + '" placeholder="ex: RJ B301-00 088" style="flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--line);font-size:14px;color:var(--ink);background:var(--paper-light)" />' +
      '<button data-action="salvar-rota" style="padding:8px 14px;border-radius:8px;background:var(--ink);color:var(--paper-light);border:none;font-weight:600">Salvar</button>' +
      "</div>" +
      '<p style="font-size:11px;margin:8px 0 0;color:' + statusCor + '">' + statusTexto + "</p>" +
      (fbDb && state.totalRotas > 0 ? '<p style="font-size:11px;margin:6px 0 0;opacity:.55">' + formatarNumero(state.totalRotas) + " " + plural(state.totalRotas, "rota diferente j\u00e1 usou", "rotas diferentes j\u00e1 usaram") + " essa ferramenta</p>" : "") +
      '<p style="font-size:11px;margin:6px 0 0;color:' + (fbDb && state.minhaRota && !state.faixasSyncErro ? "var(--ok)" : "var(--alert)") + '">' +
      (!fbDb || !state.minhaRota
        ? "\u26a0 Faixas s\u00f3 neste aparelho \u2014 sem o c\u00f3digo da rota, elas se perdem se o celular resetar"
        : state.faixasSyncErro
        ? "\u26a0 N\u00e3o consegui enviar as Faixas pra nuvem agora (sem internet?) \u2014 continuam salvas s\u00f3 neste aparelho por enquanto"
        : state.mapaRuas.length === 0
        ? "assim que cadastrar uma rua abaixo, ela j\u00e1 sobe pra nuvem sozinha"
        : "\u2713 Faixas com c\u00f3pia de seguran\u00e7a na nuvem") + "</p>" +
      (state.minhaRota
        ? '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">' +
          (fbDb ? '<button data-action="restaurar-faixas-nuvem" class="pill"' + (state.restaurandoFaixas ? " disabled" : "") + '>' + (state.restaurandoFaixas ? "Buscando..." : "\u2601 Restaurar da nuvem") + "</button>" : "") +
          '<button data-action="sair-rota" class="pill">Sair da rota</button></div>'
        : "") +
      "</div>";

    html += '<p class="muted" style="font-size:14px;margin-bottom:16px">Cadastre suas ruas, a faixa completa (se quiser fragmentar) e escolha as cores. Uma vez s\u00f3 \u2014 elas quase n\u00e3o mudam.</p>';
    html += '<div class="card" style="padding:10px;margin-bottom:16px;display:flex;gap:8px">' +
      '<input id="novoNomeRua" style="flex:1;min-width:0;background:transparent;border:none;font-size:14px;padding:8px;color:var(--ink)" value="' + esc(state.novoNomeRua) + '" placeholder="Nome da nova rua" />' +
      '<button data-action="add-rua" style="border-radius:8px;padding:0 14px;background:var(--accent);border:none;font-weight:700">+</button></div>';

    if (state.mapaRuas.length === 0) {
      html += '<div style="text-align:center;padding:40px 0"><p class="muted" style="font-size:14px">Nenhuma rua cadastrada ainda. Adicione a primeira acima.</p></div>';
      return html;
    }

    var splitsAtual = calcularSplitsPorRua();
    state.mapaRuas.forEach(function (r) {
      var cores = r.cores || coresPadrao();
      var fragmentado = !!r.fragmentar;
      var s = splitsAtual[r.id];

      html += '<div class="card" style="overflow:hidden;margin-bottom:14px">' +
        '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--paper-deep)">' +
        '<span style="flex:1;font-size:14px;font-weight:600">' + esc(r.nome) + "</span>" +
        '<button data-action="del-rua" data-id="' + r.id + '" style="border:none;background:none;color:var(--alert);opacity:.6;font-size:16px;cursor:pointer">\u{1F5D1}</button></div>';

      html += '<div style="padding:10px 12px;border-top:1px solid var(--line)">' +
        '<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">' +
        '<input type="checkbox" data-frag="' + r.id + '"' + (fragmentado ? " checked" : "") + ' style="width:16px;height:16px" />' +
        "Fragmentar em 4 cores, com base nos n\u00fameros de hoje</label>";
      if (s && (s.parTotal || s.imparTotal)) {
        if (fragmentado) {
          html += '<p style="font-size:11px;margin:6px 0 0;opacity:.6">hoje: ' + s.parTotal + " pares (corte no n\u00ba " + (s.parCorte != null ? s.parCorte : "\u2014") + ") \u00b7 " + s.imparTotal + " \u00edmpares (corte no n\u00ba " + (s.imparCorte != null ? s.imparCorte : "\u2014") + ")</p>";
        } else {
          html += '<p style="font-size:11px;margin:6px 0 0;opacity:.6">hoje: ' + s.parTotal + " pares \u00b7 " + s.imparTotal + " \u00edmpares</p>";
        }
      } else {
        html += '<p style="font-size:11px;margin:6px 0 0;opacity:.5">carregue a lista de hoje pra ver a contagem.</p>';
      }
      html += "</div>";

      html += '<div style="padding:4px 12px 10px;border-top:1px solid var(--line)">' +
        '<p style="font-size:11px;font-weight:600;margin:8px 0 0;opacity:.65">CORES</p>';

      if (!fragmentado) {
        html += colorPickRow(r.id, "par1", "PAR", cores.par1) + colorPickRow(r.id, "impar1", "\u00cdMPAR", cores.impar1);
      } else {
        html += colorPickRow(r.id, "par1", "PAR \u00b7 1\u00aa metade", cores.par1) +
          colorPickRow(r.id, "par2", "PAR \u00b7 2\u00aa metade", cores.par2) +
          colorPickRow(r.id, "impar1", "\u00cdMPAR \u00b7 1\u00aa metade", cores.impar1) +
          colorPickRow(r.id, "impar2", "\u00cdMPAR \u00b7 2\u00aa metade", cores.impar2);
      }
      html += "</div></div>";
    });
    return html;
  }

  function colorPickRow(ruaId, campo, label, valor) {
    var chave = ruaId + "|" + campo;
    var aberta = state.paletaAberta === chave;
    var html = '<div class="colorpick-row"><span>' + label + '</span>' +
      '<button data-action="abrir-paleta" data-chave="' + chave + '" class="swatch" style="background:' + valor + '" aria-label="Escolher cor"></button></div>';
    if (aberta) {
      html += '<div style="display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 12px;justify-content:flex-end">';
      PALETA_CORES.forEach(function (cor) {
        var selecionada = normalizar(cor) === normalizar(valor);
        html += '<button data-action="escolher-cor" data-rua="' + ruaId + '" data-campo="' + campo + '" data-cor="' + cor + '" class="swatch-mini" style="background:' + cor + ';border:' + (selecionada ? "2.5px solid var(--ink)" : "1px solid var(--line)") + '" aria-label="' + cor + '"></button>';
      });
      html += "</div>";
    }
    return html;
  }

  // ---------- eventos ----------
  function attachHandlers() {
    var app = document.getElementById("app");

    app.querySelectorAll("[data-tab]").forEach(function (el) {
      el.onclick = function () { setAba(el.getAttribute("data-tab")); };
    });

    var iniciarBtn = app.querySelector('[data-action="iniciar-camera"]');
    if (iniciarBtn) iniciarBtn.onclick = iniciarCamera;
    var alternarBipeBtn = app.querySelector('[data-action="alternar-bipe"]');
    if (alternarBipeBtn) alternarBipeBtn.onclick = alternarBipe;

    var textoEl = document.getElementById("textoColado");
    if (textoEl) textoEl.oninput = function () { state.textoColado = textoEl.value; var btn = app.querySelector('[data-action="organizar"]'); if (btn) btn.disabled = !state.textoColado.trim(); };
    var organizarBtn = app.querySelector('[data-action="organizar"]');
    if (organizarBtn) organizarBtn.onclick = organizarPacotes;
    var limparSessaoBtn = app.querySelector('[data-action="limpar-sessao"]');
    if (limparSessaoBtn) limparSessaoBtn.onclick = limparSessao;

    app.querySelectorAll('[data-action="toggle-separado"]').forEach(function (el) {
      el.onclick = function () {
        var atual = statusDe(el.getAttribute("data-id")).separado;
        marcarSeparado(el.getAttribute("data-id"), !atual);
      };
    });
    app.querySelectorAll('[data-action="marcar-entrega"]').forEach(function (el) {
      el.onclick = function () {
        marcarEntrega(el.getAttribute("data-id"), el.getAttribute("data-campo"));
      };
    });
    app.querySelectorAll('[data-action="ver-foto-pacote"]').forEach(function (el) {
      el.onclick = function () { verFotoPacote(el.getAttribute("data-id")); };
    });
    app.querySelectorAll('[data-action="apagar-foto-pacote"]').forEach(function (el) {
      el.onclick = function () { apagarFotoPacote(el.getAttribute("data-id")); };
    });
    var fecharFotoVisBtn = app.querySelector('[data-action="fechar-foto-visualizando"]');
    if (fecharFotoVisBtn) fecharFotoVisBtn.onclick = fecharFotoVisualizando;
    var apagarFotoVisBtn = app.querySelector('[data-action="apagar-foto-visualizando"]');
    if (apagarFotoVisBtn) {
      apagarFotoVisBtn.onclick = function () {
        var vis = state.fotoVisualizando;
        fecharFotoVisualizando();
        if (!vis) return;
        if (vis.tipo === "fachada") apagarFachada(vis.chave);
        else apagarFotoPacote(vis.linhaId);
      };
    }
    app.querySelectorAll('[data-action="foto-fachada"]').forEach(function (el) {
      el.onclick = function () { abrirFachadaFoto(el.getAttribute("data-rua"), el.getAttribute("data-numero")); };
    });
    app.querySelectorAll('[data-action="ver-foto-fachada"]').forEach(function (el) {
      el.onclick = function () { verFotoFachada(el.getAttribute("data-chave")); };
    });
    app.querySelectorAll('[data-action="apagar-fachada"]').forEach(function (el) {
      el.onclick = function () { apagarFachada(el.getAttribute("data-chave")); };
    });
    app.querySelectorAll('[data-action="foto-lote"]').forEach(function (el) {
      el.onclick = function () { abrirLoteFoto(el.getAttribute("data-rua"), el.getAttribute("data-numero")); };
    });
    app.querySelectorAll('[data-action="quem-recebeu"]').forEach(function (el) {
      var id = el.getAttribute("data-id");
      el.oninput = function () {
        if (!state.entregaInfo[id]) state.entregaInfo[id] = {};
        state.entregaInfo[id].quemRecebeu = el.value;
      };
      el.onblur = function () { salvarQuemRecebeu(id, el.value); };
    });
    app.querySelectorAll('[data-action="alternar-individual"]').forEach(function (el) {
      el.onclick = function () {
        alternarEnderecoIndividual(el.getAttribute("data-chave"), el.getAttribute("data-rua"), el.getAttribute("data-numero"));
      };
    });
    app.querySelectorAll('[data-action="quem-recebeu-endereco"]').forEach(function (el) {
      var ruaNome = el.getAttribute("data-rua");
      var numero = el.getAttribute("data-numero");
      el.oninput = function () { aplicarQuemRecebeuEndereco(ruaNome, numero, el.value, false); };
      el.onblur = function () { aplicarQuemRecebeuEndereco(ruaNome, numero, el.value, true); };
    });
    var baixarZipBtn = app.querySelector('[data-action="baixar-zip"]');
    if (baixarZipBtn) baixarZipBtn.onclick = baixarFotosDoDia;
    var reenviarBtn = app.querySelector('[data-action="reenviar-pendentes"]');
    if (reenviarBtn) reenviarBtn.onclick = tentarReenviarFila;

    var novoNomeEl = document.getElementById("novoNomeRua");
    if (novoNomeEl) novoNomeEl.oninput = function () { state.novoNomeRua = novoNomeEl.value; };
    var addRuaBtn = app.querySelector('[data-action="add-rua"]');
    if (addRuaBtn) addRuaBtn.onclick = adicionarRua;
    var salvarRotaBtn = app.querySelector('[data-action="salvar-rota"]');
    if (salvarRotaBtn) salvarRotaBtn.onclick = function () {
      var v = document.getElementById("minhaRotaInput").value.trim();
      // Apagar o campo e clicar em Salvar antes não fazia absolutamente nada
      // (o código voltava sozinho na tela seguinte) — agora vale como sair.
      if (v) salvarMinhaRota(v);
      else sairDaRota();
    };
    var sairRotaBtn = app.querySelector('[data-action="sair-rota"]');
    if (sairRotaBtn) sairRotaBtn.onclick = sairDaRota;
    var restaurarFaixasBtn = app.querySelector('[data-action="restaurar-faixas-nuvem"]');
    if (restaurarFaixasBtn) restaurarFaixasBtn.onclick = restaurarFaixasDaNuvem;
    app.querySelectorAll('[data-action="del-rua"]').forEach(function (el) {
      el.onclick = function () { removerRua(el.getAttribute("data-id")); };
    });
    app.querySelectorAll("[data-frag]").forEach(function (el) {
      el.onchange = function () { toggleFragmentar(el.getAttribute("data-frag"), el.checked); };
    });
    app.querySelectorAll('[data-action="abrir-paleta"]').forEach(function (el) {
      el.onclick = function () { toggleAbrirPaleta(el.getAttribute("data-chave")); };
    });
    app.querySelectorAll('[data-action="escolher-cor"]').forEach(function (el) {
      el.onclick = function () { escolherCor(el.getAttribute("data-rua"), el.getAttribute("data-campo"), el.getAttribute("data-cor")); };
    });
  }

  if (state.minhaRota) conectarRota(state.minhaRota);
  render();
  if (state.filaPendente.length > 0) tentarReenviarFila();
})();
</script>
</body>
</html>
