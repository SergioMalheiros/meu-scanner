<meta name="theme-color" content="#1B2620" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Entregas" />
<style>
  :root {
    --ink: #1B2620;
    --paper: #EAE6D6;
    --paper-light: #F5F2E7;
    --paper-deep: #DDD8C2;
    --accent: #DB9A34;
    --accent-deep: #8F5B14;
    --line: #CBC5AA;
    --ok: #4C7A5E;
    --alert: #AA4530;
    --alert-light: #F1DCD4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 420px; margin: 0 auto; padding: 0 16px 64px; }
  header { padding: 32px 0 20px; }
  header .titlerow { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  header h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .tabs { display: flex; border-radius: 10px; padding: 4px; background: var(--paper-deep); margin-bottom: 20px; gap: 2px; }
  .tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 10px 4px; border-radius: 7px; font-size: 13px; font-weight: 600; border: none; background: transparent; color: var(--ink); opacity: .6; cursor: pointer; font-family: inherit; }
  .tab.active { background: var(--ink); color: var(--paper-light); opacity: 1; }
  .card { border-radius: 10px; background: var(--paper-light); border: 1px solid var(--line); }
  .muted { opacity: .75; }
  .btn-primary { width: 100%; padding: 13px; border-radius: 10px; font-weight: 600; font-size: 14px; border: none; background: var(--ink); color: var(--paper-light); cursor: pointer; font-family: inherit; }
  .btn-primary:disabled { opacity: .4; }
  input, textarea, select { font-family: inherit; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .result-color { border-radius: 14px; padding: 28px 20px; text-align: center; }
  .result-warn { border-radius: 14px; padding: 16px; text-align: center; font-size: 14px; background: var(--alert-light); color: var(--alert); }
  .checkbox { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .checkbox.done { background: var(--ok); border-color: var(--ok); }
  .nome-separado { color: var(--ok); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  video { width: 100%; min-height: 240px; object-fit: cover; border-radius: 10px; background: #000; margin-top: 12px; }
  .warn-box { border-radius: 10px; padding: 12px; font-size: 13px; background: var(--alert-light); color: var(--alert); }
  .colorpick-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 13px; }
  .swatch { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); padding: 0; cursor: pointer; }
  .swatch-mini { width: 30px; height: 30px; border-radius: 8px; padding: 0; cursor: pointer; }
  .pill { font-size: 11px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper-light); color: var(--ink); cursor: pointer; font-family: inherit; font-weight: 600; }
  .pill.ativo-entregue { background: var(--ok); border-color: var(--ok); color: var(--paper-light); }
  .pill.ativo-devolvido { background: var(--alert); border-color: var(--alert); color: var(--paper-light); }
  .pill.ativo-pendente { background: var(--accent); border-color: var(--accent); color: var(--ink); }
</style>

<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyAcDi0XGCVu1-NUW82rklsrjHLXgxdbss4",
    authDomain: "simplificando-as-entregas.firebaseapp.com",
    databaseURL: "https://simplificando-as-entregas-default-rtdb.firebaseio.com",
    projectId: "simplificando-as-entregas",
    storageBucket: "simplificando-as-entregas.firebasestorage.app",
    messagingSenderId: "807848505946",
    appId: "1:807848505946:web:fcf700c76f8a32f1b49e63"
  };
  var fbDb = null;
  try {
    if (window.firebase && firebase.initializeApp) {
      firebase.initializeApp(firebaseConfig);
      fbDb = firebase.database();
    }
  } catch (e) {
    fbDb = null;
  }

  // ---------- Cloudinary (armazenamento das fotos) ----------
  // Preencha com os dados da sua conta Cloudinary (Settings > Upload > Upload presets,
  // crie um preset com Signing Mode = Unsigned). Enquanto estiver com os valores de
  // exemplo abaixo, o app roda normal, só as fotos ficam desativadas.
  var CLOUDINARY_CLOUD_NAME = "debey3jdv";
  var CLOUDINARY_UPLOAD_PRESET = "Simplificando as Entregas";
  var cloudinaryPronto = !!(
    CLOUDINARY_CLOUD_NAME && CLOUDINARY_UPLOAD_PRESET &&
    CLOUDINARY_CLOUD_NAME.indexOf("COLE_AQUI") === -1 &&
    CLOUDINARY_UPLOAD_PRESET.indexOf("COLE_AQUI") === -1
  );
  function sanitizarChaveFirebase(s) {
    return (s || "").replace(/[.#$\[\]\/]/g, "-").trim();
  }
  function dataDeHoje() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function diasEntre(dataStr1, dataStr2) {
    var a = new Date(dataStr1 + "T00:00:00");
    var b = new Date(dataStr2 + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }
  function chaveOrdenavel(ruaNome, numero) {
    var n = parseInt(numero, 10);
    var numPad = isNaN(n) ? "999999" : String(n).padStart(6, "0");
    var ruaChave = normalizar(ruaNome).replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return ruaChave + "_" + numPad;
  }
  function comprimirImagem(file, maxLado, qualidade) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var w = img.width, h = img.height;
        if (w >= h && w > maxLado) { h = Math.round((h * maxLado) / w); w = maxLado; }
        else if (h > w && h > maxLado) { w = Math.round((w * maxLado) / h); h = maxLado; }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        canvas.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (blob) resolve(blob); else reject(new Error("falha ao comprimir"));
        }, "image/jpeg", qualidade || 0.7);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("falha ao carregar imagem")); };
      img.src = url;
    });
  }

  function blobParaBase64(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onloadend = function () { resolve(reader.result); };
      reader.onerror = function () { reject(new Error("falha ao converter foto pra guardar offline")); };
      reader.readAsDataURL(blob);
    });
  }
  function base64ParaBlob(dataUrl) {
    var partes = dataUrl.split(",");
    var mimeMatch = partes[0].match(/data:([^;]+);base64/);
    var mime = mimeMatch ? mimeMatch[1] : "image/jpeg";
    var bin = atob(partes[1]);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  // Sufixo único no nome (ver os "nomeArquivo" montados na hora de enviar): o preset
  // do Cloudinary está com "Overwrite: false", então reenviar pro mesmo
  // public_id (ex: tirar a foto de novo do mesmo pacote) NÃO substituiria a
  // imagem antiga — o Cloudinary só devolveria a antiga de novo, calado, como
  // se tivesse dado certo. Com timestamp no nome, cada envio vira um arquivo
  // realmente novo, e o app sempre usa a URL do envio mais recente (é essa
  // URL que fica salva no Firebase).
  function subirParaCloudinary(blob, pasta, nomeArquivo) {
    var formData = new FormData();
    formData.append("file", blob, nomeArquivo + ".jpg");
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    formData.append("folder", pasta);
    formData.append("public_id", nomeArquivo);

    return fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/image/upload", {
      method: "POST",
      body: formData
    }).catch(function () {
      var erroRede = new Error("sem conexão com o Cloudinary agora");
      erroRede.semConexao = true;
      throw erroRede;
    }).then(function (resp) {
      if (!resp.ok) {
        return resp.text().then(function (texto) {
          var erro = new Error("Cloudinary respondeu " + resp.status + ": " + texto);
          erro.respostaInvalida = true;
          throw erro;
        });
      }
      return resp.json();
    }).then(function (dados) {
      return dados.secure_url;
    });
  }

  // ---------- fila de fotos pendentes (offline) ----------
  function idFila() { return "F" + Date.now() + "-" + Math.random().toString(36).slice(2, 8); }
  function salvarFila() { salvar("fila-fotos-pendentes", state.filaPendente); }
  function removerDaFilaPorIdentidade(item) {
    state.filaPendente = state.filaPendente.filter(function (p) {
      if (p.tipo !== item.tipo) return true;
      return item.tipo === "pacote" ? p.linhaId !== item.linhaId : p.chave !== item.chave;
    });
  }
  function pacotePendenteFila(linhaId) {
    return state.filaPendente.some(function (p) { return p.tipo === "pacote" && p.linhaId === linhaId; });
  }
  function fachadaPendenteFila(chave) {
    return state.filaPendente.some(function (p) { return p.tipo === "fachada" && p.chave === chave; });
  }

  function gravarFotoNoFirebase(item, url) {
    if (item.tipo === "pacote") {
      var quemRecebeu = (state.entregaInfo[item.linhaId] && state.entregaInfo[item.linhaId].quemRecebeu) || item.quemRecebeuSnapshot || "";
      fbDb.ref("lotes/" + item.chaveRota + "/entregas/" + item.data + "/" + item.codigo).set({
        rua: item.rua, numero: item.numero, nome: item.nome || "", quemRecebeu: quemRecebeu,
        fotoPacoteUrl: url, chave: item.chave, ts: Date.now()
      });
    } else if (item.tipo === "fachada") {
      // Sem data no caminho de propósito: a fachada de um prédio não muda de
      // um dia pro outro, então fica registrada pra sempre (por rota +
      // endereço) e é reaproveitada automaticamente quando a rota se repete.
      fbDb.ref("lotes/" + item.chaveRota + "/fachadas_permanentes/" + item.chave).set({
        rua: item.rua, numero: item.numero, fotoFachadaUrl: url, ts: Date.now()
      });
    }
  }

  // Primeira tentativa de envio, logo depois de tirar a foto. Se falhar por
  // causa de conexão, guarda a foto (em base64) no localStorage pra tentar de
  // novo mais tarde, em vez de simplesmente perder ou travar o app.
  function processarEnvioFoto(item, blob) {
    subirParaCloudinary(blob, item.pasta, item.nomeArquivo).then(function (url) {
      gravarFotoNoFirebase(item, url);
      render();
    }).catch(function (err) {
      if (err && err.respostaInvalida) {
        alert("O Cloudinary recusou o envio da foto (não parece falta de conexão, e sim algo de configuração). Me avisa com essa mensagem:\n\n" + err.message);
        return;
      }
      blobParaBase64(blob).then(function (base64) {
        removerDaFilaPorIdentidade(item);
        item.id = idFila();
        item.blobBase64 = base64;
        item.criadoEm = Date.now();
        state.filaPendente.push(item);
        salvarFila();
        render();
      }).catch(function () {
        alert("Não consegui enviar a foto nem guardar ela pra tentar depois. Tire de novo, se der.");
      });
    });
  }

  // Reenvia a fila pendente, um item de cada vez (mais confiável numa conexão
  // fraca do que mandar tudo junto). Chamada quando a conexão volta, quando o
  // app volta a ficar visível, no carregamento, e pelo botão manual.
  function tentarReenviarFila() {
    if (state.enviandoFila || !cloudinaryPronto || !fbDb) return;
    if (!state.filaPendente.length) return;
    state.enviandoFila = true;
    var pendentes = state.filaPendente.slice();

    function processarProximo(i) {
      if (i >= pendentes.length) {
        state.enviandoFila = false;
        render();
        return;
      }
      var item = pendentes[i];
      Promise.resolve().then(function () {
        return subirParaCloudinary(base64ParaBlob(item.blobBase64), item.pasta, item.nomeArquivo);
      }).then(function (url) {
        gravarFotoNoFirebase(item, url);
        state.filaPendente = state.filaPendente.filter(function (p) { return p.id !== item.id; });
        salvarFila();
      }).catch(function () {
        // ainda sem conexão (ou erro passageiro) — deixa na fila, tenta o próximo
      }).then(function () {
        render();
        processarProximo(i + 1);
      });
    }
    processarProximo(0);
  }

  // Uma vez que o pacote já tem foto confirmada (ícone verde), clicar nele
  // mostra a foto em vez de abrir a câmera de novo — pra retirar é preciso
  // apagar primeiro (função separada), só então o ícone volta a abrir a
  // câmera pra uma foto nova.
  function verFotoPacote(linhaId) {
    var info = state.entregaInfo[linhaId];
    if (!info || !info.fotoPacoteUrl) return;
    state.fotoVisualizando = { linhaId: linhaId, url: info.fotoPacoteUrl };
    render();
  }

  function fecharFotoVisualizando() {
    state.fotoVisualizando = null;
    render();
  }

  function apagarFotoPacote(linhaId) {
    var linha = state.linhasParseadas && state.linhasParseadas.find(function (l) { return l.id === linhaId; });
    if (!linha) return;
    if (!confirm("Apagar essa foto? Depois dá pra tirar uma nova.")) return;
    if (state.entregaInfo[linhaId]) state.entregaInfo[linhaId].fotoPacoteUrl = "";
    if (fbDb && state.minhaRota && linha.codigo) {
      var chaveRota = sanitizarChaveFirebase(state.minhaRota);
      fbDb.ref("lotes/" + chaveRota + "/entregas/" + dataDeHoje() + "/" + linha.codigo + "/fotoPacoteUrl").remove();
    }
    render();
  }

  function abrirFachadaFoto(ruaNome, numero) {
    if (!cloudinaryPronto || !fbDb || !state.minhaRota) return;
    var chave = chaveOrdenavel(ruaNome, numero);
    // Fachada agora é permanente (vale pra rota inteira, em qualquer dia) —
    // se já tem uma registrada, confirma antes de substituir pra evitar
    // apagar sem querer uma foto boa com um toque sem querer no botão.
    if (state.fachadaInfo[chave] && !confirm("Essa fachada já está registrada (vale pra toda a rota, em qualquer dia). Quer tirar outra foto e substituir?")) {
      return;
    }
    // Mesma câmera ao vivo do "Todas"/"Foto" (sem input nativo) — só que sem
    // itens de pacote e sem pedir quem recebeu, já que fachada é só a foto
    // do prédio.
    definirFoco("endereco-" + chave);
    state.loteFoto = { tipo: "fachada", ruaNome: ruaNome, numero: numero, itens: [], fotos: [], statusCamera: "pedindo", erro: "" };
    render();
    iniciarCameraLote();
  }

  // ---------- câmera ao vivo por endereço (pacotes e fachada) ----------
  // Única forma de tirar foto no app — pacote(s) e fachada. Antes existia
  // também uma câmera nativa (sair pro app de câmera do celular e voltar),
  // com qualidade um pouco melhor, mas cada foto exigia sair e voltar do app
  // — e em vários aparelhos isso não reabria sozinho pro próximo pacote.
  // Essa aqui abre uma câmera ao vivo DENTRO do app (mesma técnica da aba de
  // escanear) com um obturador na tela: tira quantas quiser sem sair da
  // tela, revisa as miniaturas, e só envia quando aperta "Enviar" — bem mais
  // rápido e prático, principalmente pra prédios com vários pacotes. O
  // mesmo state.loteFoto serve tanto pra pacote(s) (tipo "pacotes", pede
  // quem recebeu) quanto pra fachada (tipo "fachada", 1 foto só, sem quem
  // recebeu).
  var streamLote = null;

  function pararCameraLote() {
    if (streamLote) { streamLote.getTracks().forEach(function (t) { t.stop(); }); streamLote = null; }
  }

  function abrirLoteFoto(ruaNome, numero) {
    if (!state.linhasParseadas) return;
    // Compara pelo nome CANÔNICO da rua (o mesmo que agrupa a lista na tela),
    // não pelo texto cru colado — assim "R. Mariz e Barros" bate certinho com
    // o grupo "Rua Mariz e Barros" mesmo que o texto original seja abreviado.
    var itensDoNumero = state.linhasParseadas.filter(function (l) {
      if (l.erro || !l.codigo || String(l.numero) !== String(numero)) return false;
      var ruaMatch = encontrarRuaMapeada(l.rua, state.mapaRuas);
      return !!ruaMatch && ruaMatch.nome === ruaNome;
    });
    var itens = itensDoNumero.filter(function (l) {
      if (pacotePendenteFila(l.id)) return false;
      // Endereço com só 1 pacote: precisa poder reabrir mesmo se já tiver
      // foto (retirar uma foto ruim, por exemplo). Com mais de 1 pacote,
      // qualquer botão "Foto" clicado abre o mesmo lote de quem ainda não
      // tem foto — igual ao "Todas" — só entra aqui quem ainda não tem foto
      // (senão ia obrigar a refazer todo mundo de novo).
      if (itensDoNumero.length === 1) return true;
      var tem = !!(state.entregaInfo[l.id] && state.entregaInfo[l.id].fotoPacoteUrl);
      return !tem;
    });
    if (!itens.length) return;
    definirFoco("endereco-" + chaveOrdenavel(ruaNome, numero));
    state.loteFoto = { tipo: "pacotes", ruaNome: ruaNome, numero: numero, itens: itens, fotos: [], statusCamera: "pedindo", erro: "" };
    render();
    iniciarCameraLote();
  }

  function iniciarCameraLote() {
    if (!state.loteFoto) return;
    // Libera qualquer câmera que tenha ficado presa de uma tentativa anterior
    // (inclusive a do scanner, se por algum motivo ainda estiver aberta) antes
    // de pedir uma nova — pedir uma câmera com outra ainda ativa é uma causa
    // comum do navegador recusar o pedido.
    pararCameraLote();
    if (streamAtual) pararCamera();
    state.loteFoto.statusCamera = "pedindo";
    state.loteFoto.erro = "";
    render();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      state.loteFoto.statusCamera = "erro";
      state.loteFoto.erro = "esse navegador não expõe acesso à câmera aqui.";
      render();
      return;
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
    }).then(function (stream) {
      if (!state.loteFoto) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      streamLote = stream;
      state.loteFoto.statusCamera = "ativa";
      render();
      var video = document.getElementById("videoLote");
      if (video) { video.srcObject = stream; video.play().catch(function () {}); }
    }).catch(function (e) {
      if (!state.loteFoto) return;
      state.loteFoto.statusCamera = "erro";
      if (e.name === "NotReadableError") {
        state.loteFoto.erro = "a câmera parece estar em uso por outro app ou aba.";
      } else if (e.name === "NotFoundError" || e.name === "OverconstrainedError") {
        state.loteFoto.erro = "não encontrei nenhuma câmera disponível nesse aparelho.";
      } else {
        state.loteFoto.erro = "permissão negada ou bloqueada pelo ambiente.";
      }
      render();
    });
  }

  function tirarFotoLote(tentativas) {
    if (!state.loteFoto || state.loteFoto.statusCamera !== "ativa") return;
    var video = document.getElementById("videoLote");
    if (!video || !video.videoWidth) {
      // Bem no instante em que o botão "Tirar foto" aparece, a câmera às
      // vezes ainda não entregou o primeiro frame (o navegador já liberou o
      // acesso, mas o vídeo ainda tá "carregando") — daí o primeiro toque não
      // fazia nada, e só o segundo (quando o frame já tinha chegado)
      // funcionava. Em vez de simplesmente ignorar o toque, tenta de novo
      // sozinho por até meio segundo antes de desistir.
      tentativas = (typeof tentativas === "number" ? tentativas : 0) + 1;
      if (tentativas <= 10) setTimeout(function () { tirarFotoLote(tentativas); }, 50);
      return;
    }
    var maxLado = 1000;
    var w = video.videoWidth, h = video.videoHeight;
    if (w >= h && w > maxLado) { h = Math.round((h * maxLado) / w); w = maxLado; }
    else if (h > w && h > maxLado) { w = Math.round((w * maxLado) / h); h = maxLado; }
    var canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(video, 0, 0, w, h);
    canvas.toBlob(function (blob) {
      if (!blob || !state.loteFoto) return;
      state.loteFoto.fotos.push({ blob: blob, previewUrl: URL.createObjectURL(blob) });
      render();
    }, "image/jpeg", 0.7);
  }

  function removerFotoLote(idx) {
    if (!state.loteFoto) return;
    var removida = state.loteFoto.fotos.splice(idx, 1)[0];
    if (removida) URL.revokeObjectURL(removida.previewUrl);
    render();
  }

  function cancelarLoteFoto() {
    if (state.loteFoto && state.loteFoto.fotos.length > 0) {
      var ok = confirm("Descartar " + state.loteFoto.fotos.length + " " + plural(state.loteFoto.fotos.length, "foto tirada", "fotos tiradas") + "?");
      if (!ok) return;
    }
    pararCameraLote();
    if (state.loteFoto) state.loteFoto.fotos.forEach(function (f) { URL.revokeObjectURL(f.previewUrl); });
    state.loteFoto = null;
    render();
  }

  function enviarLoteFoto() {
    if (!state.loteFoto || !state.loteFoto.fotos.length) return;
    var lote = state.loteFoto;

    if (lote.tipo === "fachada") {
      pararCameraLote();
      state.loteFoto = null;
      render();
      var chaveRotaFachada = sanitizarChaveFirebase(state.minhaRota);
      var chaveFachada = chaveOrdenavel(lote.ruaNome, lote.numero);
      var itemFachada = {
        tipo: "fachada",
        pasta: "fotos/" + chaveRotaFachada + "/fachadas/" + chaveFachada,
        nomeArquivo: "fachada_" + Date.now(),
        chaveRota: chaveRotaFachada, chave: chaveFachada, rua: lote.ruaNome, numero: lote.numero
      };
      processarEnvioFoto(itemFachada, lote.fotos[0].blob);
      lote.fotos.forEach(function (f) { URL.revokeObjectURL(f.previewUrl); });
      return;
    }

    if (lote.fotos.length > lote.itens.length) {
      var okExtra = confirm(
        "Você tirou " + lote.fotos.length + " fotos, mas só há " + lote.itens.length + " " +
        plural(lote.itens.length, "pacote pendente", "pacotes pendentes") + " nesse endereço.\n" +
        "As últimas " + (lote.fotos.length - lote.itens.length) + " não serão enviadas. Continuar?"
      );
      if (!okExtra) return;
    }
    pararCameraLote();
    state.loteFoto = null;
    render();

    var chaveRota = sanitizarChaveFirebase(state.minhaRota);
    var data = dataDeHoje();
    var chave = chaveOrdenavel(lote.ruaNome, lote.numero);
    var n = Math.min(lote.fotos.length, lote.itens.length);
    for (var i = 0; i < n; i++) {
      var linha = lote.itens[i];
      var item = {
        tipo: "pacote",
        pasta: "fotos/" + chaveRota + "/" + data + "/" + chave,
        nomeArquivo: "pacote_" + linha.codigo + "_" + Date.now() + "_" + i,
        linhaId: linha.id, chaveRota: chaveRota, data: data, codigo: linha.codigo,
        rua: linha.rua, numero: linha.numero, nome: linha.nome || "", chave: chave,
        quemRecebeuSnapshot: (state.entregaInfo[linha.id] && state.entregaInfo[linha.id].quemRecebeu) || ""
      };
      processarEnvioFoto(item, lote.fotos[i].blob);
      URL.revokeObjectURL(lote.fotos[i].previewUrl);
    }
    for (var j = n; j < lote.fotos.length; j++) URL.revokeObjectURL(lote.fotos[j].previewUrl);
  }

  function salvarQuemRecebeu(linhaId, valor) {
    if (!state.entregaInfo[linhaId]) state.entregaInfo[linhaId] = {};
    state.entregaInfo[linhaId].quemRecebeu = valor;
    if (fbDb && state.minhaRota && state.linhasParseadas) {
      var linha = state.linhasParseadas.find(function (l) { return l.id === linhaId; });
      if (linha && linha.codigo) {
        var chaveRota = sanitizarChaveFirebase(state.minhaRota);

      });

      // Baixa tudo em paralelo (rápido), mas só encaixa no zip DEPOIS que
      // tudo já chegou — um de cada vez, na ordem exata da lista acima. Isso
      // é o que garante a ordem certa dentro do zip, não importa qual foto
      // demorou mais ou menos pra baixar.
      Promise.all(itensParaBuscar.map(function (it) {
        return fetch(it.url).then(function (r) { return r.blob(); }).catch(function () { return null; });
      })).then(function (blobs) {
        // A ordem do nome da pasta já tava certa, mas o Google Fotos não
        // agrupa "por nome" — ele ordena os álbuns/pastas pela data da foto
        // mais recente ali dentro, e as fotos daqui não carregam data (viram
        // canvas na hora de comprimir/tirar, perdem o EXIF). Sem data própria,
        // ele cai pra data do arquivo. Aqui a gente CARIMBA essa data
        // explicitamente no zip, decrescendo uma a uma na ordem certa (a
        // primeira pasta fica com a foto "mais recente", a última com a mais
        // antiga) — é o que faz o Google Fotos (que mostra o mais recente
        // primeiro) respeitar a mesma ordem das pastas.
        var agora = Date.now();
        itensParaBuscar.forEach(function (it, i) {
          if (blobs[i]) zip.folder(it.nomePasta).file(it.nomeArquivo, blobs[i], { date: new Date(agora - i * 10000) });
        });
        return zip.generateAsync({ type: "blob" });
      }).then(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "fotos-" + chaveRota + "-" + data + ".zip";
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        state.baixandoZip = false;
        render();
      }).catch(function () {
        state.baixandoZip = false;
        render();
      });
    }).catch(function () {
      state.baixandoZip = false;
      render();
    });
  }

  function calcularResultado() {
    if (!state.linhasParseadas) return null;
    var splits = calcularSplitsPorRua();
    var validas = state.linhasParseadas.filter(function (l) { return !l.erro; });
    var erros = state.linhasParseadas.filter(function (l) { return l.erro; });
    var naoMapeadas = {};
    var porGrupo = {};

    validas.forEach(function (l) {
      var ruaMatch = encontrarRuaMapeada(l.rua, state.mapaRuas);
      if (!ruaMatch) { naoMapeadas[l.rua] = true; return; }
      var c = classificar(l.numero, ruaMatch, splits);
      var key = ruaMatch.id + "|" + c.cor;
      if (!porGrupo[key]) porGrupo[key] = { ruaNome: ruaMatch.nome, label: c.label, cor: c.cor, itens: [] };
      porGrupo[key].itens.push(l);
    });

    var listaGrupos = Object.keys(porGrupo).map(function (k) {
      var g = porGrupo[k];
      var itens = g.itens.slice().sort(function (a, b) { return ordenarNumerico(a.numero, b.numero); });
      return { ruaNome: g.ruaNome, label: g.label, cor: g.cor, itens: itens, total: itens.length };
    }).sort(function (a, b) {
      var rc = a.ruaNome.localeCompare(b.ruaNome, "pt-BR");
      return rc !== 0 ? rc : a.cor.localeCompare(b.cor);
    });

    return { listaGrupos: listaGrupos, naoMapeadas: Object.keys(naoMapeadas), erros: erros };
  }

  // ---------- câmera ----------
  var streamAtual = null;
  var ultimoCodigo = { codigo: null, ts: 0 };

  function pararCamera() {
    if (streamAtual) { streamAtual.getTracks().forEach(function (t) { t.stop(); }); streamAtual = null; }
    state.statusCamera = "idle";
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && streamAtual) {
      pararCamera();
      render();
    }
    if (document.hidden && streamLote) {
      pararCameraLote();
      if (state.loteFoto) state.loteFoto.statusCamera = "idle";
      render();
    }
    if (!document.hidden) tentarReenviarFila();
  });

  window.addEventListener("online", function () {
    tentarReenviarFila();
  });

  // Bipe curto e discreto ao separar com sucesso (mesma ideia dos leitores de
  // código de barras do galpão) — sintetizado na hora (sem precisar de
  // arquivo de áudio), então funciona offline igual ao resto do app. Fica em
  // silêncio nos casos de erro (código não encontrado / sem lista), a pedido
  // do usuário. Um dos dois pode desligar sozinho no aparelho dele, sem
  // afetar o outro (fica salvo só localmente, não é uma config da rota).
  var audioCtxBipe = null;
  function tocarBipeSucesso() {
    if (!state.bipeAtivo) return;
    try {
      if (!audioCtxBipe) audioCtxBipe = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtxBipe.state === "suspended") audioCtxBipe.resume();
      var agora = audioCtxBipe.currentTime;
      var osc = audioCtxBipe.createOscillator();
      var gain = audioCtxBipe.createGain();
      osc.type = "sine";
      osc.frequency.value = 1046.5;
      gain.gain.setValueAtTime(0.0001, agora);
      gain.gain.exponentialRampToValueAtTime(0.12, agora + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, agora + 0.11);
      osc.connect(gain);
      gain.connect(audioCtxBipe.destination);
      osc.start(agora);
      osc.stop(agora + 0.12);
    } catch (e) {
      // Sem suporte a áudio ou bloqueado pelo navegador — só não bipa.
    }
  }
  function alternarBipe() {
    state.bipeAtivo = !state.bipeAtivo;
    salvar("bipe-ativo", state.bipeAtivo);
    render();
  }

  // Flash de tela cheia com a cor da faixa, por cima da câmera, logo após um
  // bipe de sucesso — pensado pra jogar o pacote direto num saco/compartimento
  // já rotulado com essa mesma cor, sem precisar ler nada, em vez de ensacar
  // tudo junto e separar de novo na rua. Some sozinho rápido pra não atrapalhar
  // o próximo escaneamento; cada novo escaneamento reinicia a contagem, então
  // nunca some "cedo demais" por causa de um flash anterior ainda correndo.
  var flashTimeoutId = null;
  function agendarFlashScan(classificacao, rua, numero) {
    if (flashTimeoutId) clearTimeout(flashTimeoutId);
    state.flashScan = { cor: classificacao.cor, label: classificacao.label, rua: rua, numero: numero };
    flashTimeoutId = setTimeout(function () {
      flashTimeoutId = null;
      state.flashScan = null;
      render();
    }, 800);
  }

  function processarCodigoLido(codigo) {
    var agora = Date.now();
    if (ultimoCodigo.codigo === codigo && agora - ultimoCodigo.ts < 2500) return;
    ultimoCodigo = { codigo: codigo, ts: agora };

    if (!state.linhasParseadas) { state.resultadoScan = { encontrado: false, semLista: true, codigo: codigo }; render(); return; }
    var linha = state.linhasParseadas.find(function (l) { return !l.erro && l.codigo && l.codigo === codigo; });
    if (!linha) { state.resultadoScan = { encontrado: false, codigo: codigo }; render(); return; }

    var ruaMatch = encontrarRuaMapeada(linha.rua, state.mapaRuas);
    var classificacao = ruaMatch ? classificar(linha.numero, ruaMatch, calcularSplitsPorRua()) : null;
    state.resultadoScan = { encontrado: true, rua: linha.rua, numero: linha.numero, nome: linha.nome, classificacao: classificacao };
    tocarBipeSucesso();
    if (classificacao) agendarFlashScan(classificacao, linha.rua, linha.numero);
    marcarSeparado(linha.id, true);
  }

  function iniciarCamera() {
    // Mesma ideia da câmera em lote: solta qualquer câmera presa antes de
    // pedir esta, pra não disputar o hardware com uma câmera que ficou aberta.
    if (streamLote) pararCameraLote();
    state.statusCamera = "pedindo"; state.erroCamera = ""; state.resultadoScan = null; render();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      state.statusCamera = "erro"; state.erroCamera = "esse navegador não expõe acesso à câmera aqui."; render(); return;
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
    }).then(function (stream) {
      streamAtual = stream;
      state.statusCamera = ("BarcodeDetector" in window) ? "ativa" : "sem-suporte";
      render();
      var video = document.getElementById("video");
      if (video) {
        video.srcObject = stream;
        video.play().catch(function () {});
      }
      if (!("BarcodeDetector" in window)) return;
      var detector = new BarcodeDetector();
      function tick() {
        if (!streamAtual) return;
        var v = document.getElementById("video");
        if (!v) { requestAnimationFrame(tick); return; }
        detector.detect(v).then(function (codes) {
          if (codes.length > 0) processarCodigoLido(codes[0].rawValue);
        }).catch(function () {});
        requestAnimationFrame(tick);
      }
      tick();
    }).catch(function (e) {
      state.statusCamera = "erro";
      if (e.name === "NotReadableError") {
        state.erroCamera = "a c\u00e2mera parece estar em uso por outro app ou aba. Feche outros apps que usem c\u00e2mera (ou feche e abra o navegador de novo) e tente de novo. Detalhe t\u00e9cnico: " + e.message;
      } else if (e.name === "NotFoundError" || e.name === "OverconstrainedError") {
        state.erroCamera = "n\u00e3o encontrei nenhuma c\u00e2mera dispon\u00edvel nesse aparelho. Detalhe t\u00e9cnico: " + e.message;
      } else {
        state.erroCamera = "permiss\u00e3o negada ou bloqueada pelo ambiente. Detalhe t\u00e9cnico: " + e.message;
      }
      render();
    });
  }

  // Overlay simples por cima da tela atual (não substitui o app.innerHTML
  // inteiro como o loteFoto) — assim fechar não mexe no scroll da lista por
  // baixo.
  function renderVisualizadorFoto() {
    if (!state.fotoVisualizando) return "";
    return '<div style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px">' +
      '<img src="' + state.fotoVisualizando.url + '" style="max-width:100%;max-height:70vh;border-radius:8px;object-fit:contain" />' +
      '<div style="display:flex;gap:10px">' +
      '<button data-action="fechar-foto-visualizando" class="pill" style="background:#fff;color:#000">Fechar</button>' +
      '<button data-action="apagar-foto-visualizando" class="pill" style="background:var(--alert);color:#fff">\u{1F5D1}️ Apagar foto</button>' +
      "</div></div>";
  }

  // ---------- render ----------
  function setAba(a) {
    if (state.aba !== a) {
      if (streamAtual) pararCamera();
      state.resultadoScan = null;
      state.flashScan = null;
      if (flashTimeoutId) { clearTimeout(flashTimeoutId); flashTimeoutId = null; }
    }
    state.aba = a;
    render();
  }

  function render() {
    var app = document.getElementById("app");

    if (state.loteFoto) {
      app.innerHTML = renderLoteFoto();
      attachHandlersLote();
      var vLote = document.getElementById("videoLote");
      if (vLote && streamLote && vLote.srcObject !== streamLote) {
        vLote.srcObject = streamLote;
        vLote.play().catch(function () {});
      }
      return;
    }

    var html = "";

    var contadorAtivo = !!state.rotaConectada;
    html += '<header><div class="titlerow"><span style="font-size:22px">\u{1F4E6}</span><h1>Simplificando as Entregas</h1></div>' +
      '<p style="font-size:12px;opacity:.6;margin:2px 0 0">' + formatarNumero(state.contadorGlobal || 0) + " \u00b7 " +
      (contadorAtivo ? "Todos os pacotes processados no galp\u00e3o" : "Pacotes processados neste aparelho") +
      "</p>" +
      (state.filaPendente.length > 0 ? '<p style="font-size:12px;margin:4px 0 0;color:var(--accent-deep);font-weight:600">\u23f3 ' + state.filaPendente.length + " " + plural(state.filaPendente.length, "foto pendente de envio", "fotos pendentes de envio") + "</p>" : "") +
      "</header>";

    html += '<div class="tabs">' +
      tabBtn("escanear", "\u{1F4F7} C\u00e2mera") +
      tabBtn("separar", "\u{1F4E6} Hoje") + tabBtn("mapa", "\u{1F4CD} Faixas") + '</div>';

    if (state.aba === "separar" && state.linhasParseadas) {
      html += '<button class="btn-primary" data-action="limpar-sessao" style="background:transparent;border:1px solid var(--line);color:var(--ink);opacity:.7;margin:10px 0 14px">\u21bb Limpar e come\u00e7ar novo dia</button>';
    }

    if (state.aba === "escanear") html += renderCamera();
    else if (state.aba === "separar") html += renderSeparar();
    else if (state.aba === "mapa") html += renderMapa();

    html += renderVisualizadorFoto();

    app.innerHTML = html;

    attachHandlers();
    if (state.aba === "escanear" && streamAtual) {
      var v2 = document.getElementById("video");
      if (v2 && v2.srcObject !== streamAtual) {
        v2.srcObject = streamAtual;
        v2.play().catch(function () {});
      }
    }

    // Volta o scroll pro pacote/endereço onde a foto foi tirada, em vez de
    // deixar a lista voltar pro topo (só usa uma vez e descarta — ver
    // comentário perto de "definirFoco").
    if (focoAncora) {
      var idFoco = focoAncora;
      focoAncora = null;
      salvar("foco-ancora", null);
      var elFoco = document.getElementById(idFoco);
      if (elFoco) elFoco.scrollIntoView({ block: "center" });
    }
  }

  function tabBtn(id, label) {
    return '<button class="tab' + (state.aba === id ? " active" : "") + '" data-tab="' + id + '">' + label + "</button>";
  }

  function renderLoteFoto() {
    var lote = state.loteFoto;
    var ehFachada = lote.tipo === "fachada";
    var quemRecebeuLote = "";
    for (var qi = 0; qi < lote.itens.length; qi++) {
      var qv = (state.entregaInfo[lote.itens[qi].id] && state.entregaInfo[lote.itens[qi].id].quemRecebeu) || "";
      if (qv) { quemRecebeuLote = qv; break; }
    }
    var infoLinha = ehFachada
      ? (lote.fotos.length > 0 ? "foto pronta pra enviar" : "tire 1 foto da fachada do prédio")
      : (lote.fotos.length + ' ' + plural(lote.fotos.length, "foto tirada", "fotos tiradas") + ' · ' + lote.itens.length + ' ' + plural(lote.itens.length, "pacote pendente", "pacotes pendentes"));
    var html = '<div style="padding:24px 0">';
    html += '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:8px">' +
      '<div><p style="font-weight:700;font-size:15px;margin:0">' + esc(lote.ruaNome) + ' · nº ' + esc(lote.numero) + (ehFachada ? " · fachada" : "") + '</p>' +
      '<p style="font-size:12px;opacity:.65;margin:2px 0 0">' + infoLinha + '</p></div>' +
      '<button data-action="cancelar-lote" style="border:none;background:none;font-size:22px;color:var(--ink);opacity:.6;cursor:pointer;flex-shrink:0">✕</button></div>';

    if (!ehFachada) {
      // Nome de quem recebeu esse lote inteiro — não pergunta nome por pacote
      // (na entrega ninguém confere isso, só pega tudo do número e fotografa).
      // Fachada não pergunta isso — é só a foto do prédio.
      html += '<input id="quemRecebeuLoteInput" value="' + esc(quemRecebeuLote) + '" placeholder="Quem recebeu esse lote? (ex: porteiro)" style="width:100%;font-size:13px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:var(--paper-light);margin-bottom:12px;box-sizing:border-box" />';
    }

    if (lote.statusCamera === "pedindo") {
      html += '<p class="muted" style="text-align:center;padding:16px 0">pedindo acesso à câmera...</p>';
    } else if (lote.statusCamera === "erro") {
      html += '<div class="warn-box">' + esc(lote.erro) + '</div>' +
        '<button data-action="reativar-camera-lote" class="btn-primary" style="margin-top:8px">Tentar de novo</button>';
    } else if (lote.statusCamera === "idle") {
      html += '<div class="warn-box">câmera pausada (o app ficou em segundo plano).</div>' +
        '<button data-action="reativar-camera-lote" class="btn-primary" style="margin-top:8px">▶️ Reativar câmera</button>';
    }

    html += '<video id="videoLote" playsinline autoplay muted style="display:' + (lote.statusCamera === "ativa" ? "block" : "none") + '"></video>';

    if (lote.statusCamera === "ativa" && (!ehFachada || lote.fotos.length === 0)) {
      // Fachada é só 1 foto — depois de tirada, o obturador some (pra ver de
      // novo é só apagar a miniatura, que ele volta).
      html += '<button data-action="tirar-foto-lote" class="btn-primary" style="margin-top:12px;font-size:16px;padding:16px">📸 ' +
        (ehFachada ? "Tirar foto da fachada" : "Tirar foto (" + (lote.fotos.length + 1) + "ª)") + '</button>';
    }

    if (lote.fotos.length > 0) {
      html += '<div style="display:flex;gap:8px;overflow-x:auto;padding:14px 0">';
      lote.fotos.forEach(function (f, idx) {
        var pacoteDaFoto = lote.itens[idx];
        // Só a posição (nº do pedido/pacote), nunca o nome de quem é o
        // destinatário — na entrega isso não é conferido, e ia confundir
        // (o nome que representa esse lote todo é o do campo acima).
        var legenda = ehFachada ? "fachada" : (pacoteDaFoto ? ((idx + 1) + "ª · cód. " + pacoteDaFoto.codigo.slice(-6)) : "extra");
        html += '<div style="position:relative;flex-shrink:0;text-align:center">' +
          '<img src="' + f.previewUrl + '" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block" />' +
          '<button data-action="remover-foto-lote" data-idx="' + idx + '" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--alert);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer">✕</button>' +
          '<p style="font-size:9px;opacity:.6;margin:3px 0 0;width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(legenda) + '</p></div>';
      });
      html += '</div>';
    }

    html += '<button data-action="enviar-lote" class="btn-primary" style="margin-top:8px"' + (lote.fotos.length === 0 ? " disabled" : "") + '>' +
      '✅ ' + (ehFachada ? "Enviar foto da fachada" : "Enviar " + lote.fotos.length + " " + plural(lote.fotos.length, "foto", "fotos")) + '</button>';
    html += '</div>';
    return html;
  }

  function attachHandlersLote() {
    var app = document.getElementById("app");
    var quemRecebeuLoteInput = document.getElementById("quemRecebeuLoteInput");
    if (quemRecebeuLoteInput && state.loteFoto) {
      var loteRuaNome = state.loteFoto.ruaNome, loteNumero = state.loteFoto.numero;
      quemRecebeuLoteInput.oninput = function () { aplicarQuemRecebeuEndereco(loteRuaNome, loteNumero, quemRecebeuLoteInput.value, false); };
      quemRecebeuLoteInput.onblur = function () { aplicarQuemRecebeuEndereco(loteRuaNome, loteNumero, quemRecebeuLoteInput.value, true); };
    }
    var cancelarBtn = app.querySelector('[data-action="cancelar-lote"]');
    if (cancelarBtn) cancelarBtn.onclick = cancelarLoteFoto;
    var reativarBtn = app.querySelector('[data-action="reativar-camera-lote"]');
    if (reativarBtn) reativarBtn.onclick = iniciarCameraLote;
    var tirarBtn = app.querySelector('[data-action="tirar-foto-lote"]');
    if (tirarBtn) tirarBtn.onclick = function () { tirarFotoLote(); };
    var enviarBtn = app.querySelector('[data-action="enviar-lote"]');
    if (enviarBtn) enviarBtn.onclick = enviarLoteFoto;
    app.querySelectorAll('[data-action="remover-foto-lote"]').forEach(function (el) {
      el.onclick = function () { removerFotoLote(parseInt(el.getAttribute("data-idx"), 10)); };
    });
  }

  function renderFlashScan() {
    if (!state.flashScan) return "";
    var f = state.flashScan;
    var corTexto = corTextoParaHex(f.cor);
    return '<div style="position:fixed;inset:0;background:' + f.cor + ';z-index:1200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none">' +
      '<p style="font-size:60px;font-weight:800;margin:0;color:' + corTexto + '">' + f.label + '</p>' +
      '<p style="font-size:20px;font-weight:600;margin:0;color:' + corTexto + ';opacity:.9">' + esc(f.rua) + ' · nº ' + esc(f.numero) + '</p>' +
      "</div>";
  }

  function renderCamera() {
    if (!state.linhasParseadas) {
      return '<div class="warn-box">Carregue a lista do dia na aba "Hoje" primeiro \u2014 \u00e9 dela que vem o n\u00famero de cada pacote.</div>';
    }
    var html = '<div style="display:flex;justify-content:flex-end;margin-bottom:8px">' +
      '<button data-action="alternar-bipe" class="pill' + (state.bipeAtivo ? " ativo-entregue" : "") + '">' +
      (state.bipeAtivo ? "\ud83d\udd0a Bipe ligado" : "\ud83d\udd07 Bipe desligado") + '</button></div>';
    if (state.statusCamera === "idle") {
      html += '<button class="btn-primary" data-action="iniciar-camera">\u{1F4F7} iniciar c\u00e2mera</button>';
    } else if (state.statusCamera === "pedindo") {
      html += '<p class="muted" style="text-align:center;padding:16px 0">pedindo acesso \u00e0 c\u00e2mera...</p>';
    } else if (state.statusCamera === "erro") {
      html += '<div class="warn-box">' + esc(state.erroCamera) + "</div>";
    } else if (state.statusCamera === "sem-suporte") {
      html += '<div class="warn-box">A c\u00e2mera ligou, mas esse navegador n\u00e3o tem leitor nativo de QR/c\u00f3digo de barras.</div>';
    }
    html += '<video id="video" playsinline autoplay muted style="display:' + (state.statusCamera === "ativa" ? "block" : "none") + '"></video>';

    if (state.resultadoScan) {
      var r = state.resultadoScan;
      if (r.encontrado && r.classificacao) {
        var c = r.classificacao;
        html += '<div class="result-color" style="margin-top:12px;background:' + c.cor + '">' +
          '<p style="font-size:32px;font-weight:700;margin:0 0 10px;color:' + corTextoParaHex(c.cor) + '">' + c.label + '</p>' +
          '<p style="font-size:16px;font-weight:600;margin:0;color:' + corTextoParaHex(c.cor) + ';opacity:.9">' + esc(r.rua) + ' \u00b7 n\u00ba ' + esc(r.numero) + (r.nome ? " \u00b7 " + esc(r.nome) : "") + '</p></div>';
      } else if (r.encontrado) {
        html += '<div class="result-warn" style="margin-top:12px">Achei o pacote (' + esc(r.rua) + ", n\u00ba " + esc(r.numero) + ") mas essa rua n\u00e3o est\u00e1 cadastrada.</div>";
      } else {
        html += '<div class="result-warn" style="margin-top:12px">' + (r.semLista ? "carregue a lista do dia primeiro." : 'c\u00f3digo "' + esc(r.codigo) + '" n\u00e3o encontrado na lista de hoje.') + "</div>";
      }
    }
    html += renderFlashScan();
    return html;
  }

  function renderResumoBar(resultado) {
    var todos = [];
    resultado.listaGrupos.forEach(function (g) { todos = todos.concat(g.itens); });
    var total = todos.length;
    var separados = todos.filter(function (it) { return statusDe(it.id).separado; }).length;

    var html = '<div class="card" style="padding:10px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:14px">' +
      "<span><strong>" + total + "</strong> " + plural(total, "pacote", "pacotes") + " \u00b7 <strong>" + resultado.listaGrupos.length + "</strong> " + plural(resultado.listaGrupos.length, "cor", "cores") + "</span>" +
      '<span style="color:var(--ok);font-weight:600">' + separados + "/" + total + " separados</span></div>";
    return html;
  }

  function renderListaGrupos(resultado) {
    var html = "";
    resultado.listaGrupos.forEach(function (g) {
      var separadosNaCaixa = g.itens.filter(function (it) { return statusDe(it.id).separado; }).length;
      html += '<div class="card" style="overflow:hidden;margin-bottom:12px">' +
        '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:' + g.cor + '">' +
        '<span style="font-size:14px;font-weight:700;flex:1;color:' + corTextoParaHex(g.cor) + '">' + g.label + " \u00b7 " + esc(g.ruaNome) + "</span>" +
        '<span style="font-size:11px;font-family:ui-monospace,monospace;color:' + corTextoParaHex(g.cor) + ';opacity:.85">' + separadosNaCaixa + "/" + g.total + "</span></div><ul style='list-style:none;margin:0;padding:0'>";

      var contagemPorNumero = {};
      g.itens.forEach(function (it) { contagemPorNumero[it.numero] = (contagemPorNumero[it.numero] || 0) + 1; });

      g.itens.forEach(function (item, idx) {
        var st = statusDe(item.id);
        var qtdMesmoNumero = contagemPorNumero[item.numero];
        var primeiroDoNumero = idx === 0 || g.itens[idx - 1].numero !== item.numero;
        var chaveEndereco = chaveOrdenavel(g.ruaNome, item.numero);
        var temFachada = !!state.fachadaInfo[chaveEndereco];
        var fachadaPendente = !temFachada && fachadaPendenteFila(chaveEndereco);

        if (primeiroDoNumero) {
          var itensDoEndereco = g.itens.filter(function (it) { return it.numero === item.numero; });
          var semFotoNoEndereco = itensDoEndereco.filter(function (it) {
            var tem = !!(state.entregaInfo[it.id] && state.entregaInfo[it.id].fotoPacoteUrl);
            return !tem && !pacotePendenteFila(it.id);
          }).length;
          var quemRecebeuEndereco = "";
          for (var qi = 0; qi < itensDoEndereco.length; qi++) {
            var qv = (state.entregaInfo[itensDoEndereco[qi].id] && state.entregaInfo[itensDoEndereco[qi].id].quemRecebeu) || "";
            if (qv) { quemRecebeuEndereco = qv; break; }
          }
          html += '<li id="endereco-' + chaveEndereco + '" style="padding:7px 12px;background:var(--paper-deep);border-top:1px solid var(--line);list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
            '<span style="flex:1"><span style="font-size:16px;font-weight:700">n\u00ba ' + esc(item.numero) + "</span>" +
            (qtdMesmoNumero > 1 ? '<span style="font-size:14px;font-weight:700;color:var(--accent-deep)"> \u00b7 ' + qtdMesmoNumero + " pacotes</span>" : "") + "</span>" +
            (qtdMesmoNumero > 1 && semFotoNoEndereco > 0 ? '<button data-action="foto-lote" data-rua="' + esc(g.ruaNome) + '" data-numero="' + esc(item.numero) + '" class="pill">\u{1F4F7} Todas (' + semFotoNoEndereco + ')</button>' : "") +
            '<button data-action="foto-fachada" data-chave="' + chaveEndereco + '" data-rua="' + esc(g.ruaNome) + '" data-numero="' + esc(item.numero) + '" class="pill' + (temFachada ? " ativo-entregue" : (fachadaPendente ? " ativo-pendente" : "")) + '">' +
            (temFachada ? "\u2713" : (fachadaPendente ? "\u23f3" : "\u{1F4F7}")) + " Fachada</button>" +
            '<input data-action="quem-recebeu-endereco" data-rua="' + esc(g.ruaNome) + '" data-numero="' + esc(item.numero) + '" value="' + esc(quemRecebeuEndereco) + '" placeholder="Quem recebeu ' + (qtdMesmoNumero === 1 ? "esse pacote" : "esses " + qtdMesmoNumero + " pacotes") + ' (ex: porteiro)" style="flex:1 1 100%;font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:var(--paper-light)" />' +
            "</li>";
        }

        var temFotoPacote = !!(state.entregaInfo[item.id] && state.entregaInfo[item.id].fotoPacoteUrl);
        var fotoPacotePendente = !temFotoPacote && pacotePendenteFila(item.id);
        var recuo = qtdMesmoNumero > 1 ? "8px 12px 8px 26px" : "8px 12px";
        // Uma vez com foto confirmada, o \u00edcone vira "ver a foto" em vez de
        // reabrir a c\u00e2mera \u2014 pra retirar, usa o bot\u00e3o de apagar ao lado (ou
        // dentro da pr\u00f3pria visualiza\u00e7\u00e3o), e s\u00f3 depois de apagada o \u00edcone
        // volta a abrir a c\u00e2mera pra uma foto nova. Sempre usa a c\u00e2mera ao
        // vivo do "Todas" (j\u00e1 pede quem recebeu) \u2014 n\u00e3o tem mais c\u00e2mera
        // nativa aqui, com endere\u00e7o de 1 ou v\u00e1rios pacotes.
        var botaoFoto;
        if (temFotoPacote) {
          botaoFoto = '<button data-action="ver-foto-pacote" data-id="' + item.id + '" class="pill ativo-entregue">\u2713 Foto</button>' +
            '<button data-action="apagar-foto-pacote" data-id="' + item.id + '" class="pill" style="background:var(--alert);color:#fff">\ud83d\uddd1\ufe0f</button>';
        } else {
          botaoFoto = '<button data-action="foto-lote" data-rua="' + esc(g.ruaNome) + '" data-numero="' + esc(item.numero) + '" class="pill' + (fotoPacotePendente ? " ativo-pendente" : "") + '">' +
            (fotoPacotePendente ? "\u23f3" : "\u{1F4F7}") + " Foto</button>";
        }
        html += '<li id="pacote-' + item.id + '" style="padding:' + recuo + ';border-top:1px solid var(--line)">' +
          '<div data-action="toggle-separado" data-id="' + item.id + '" style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;margin-bottom:8px">' +
          '<span class="checkbox' + (st.separado ? " done" : "") + '">' + (st.separado ? "\u2713" : "") + "</span>" +
          '<span' + (st.separado ? ' class="nome-separado"' : "") + ">" + (qtdMesmoNumero > 1 ? esc(item.nome || "sem nome") : "n\u00ba " + esc(item.numero) + (item.nome ? " \u00b7 " + esc(item.nome) : "")) + "</span></div>" +
          '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
          botaoFoto +
          "</div></li>";
      });
      html += "</ul></div>";
    });
    return html;
  }

  function renderSeparar() {
    var html = "";
    if (!state.linhasParseadas) {
      html += '<div class="card" style="padding:12px;font-size:12px;line-height:1.5;margin-bottom:12px">' +
        '<p style="font-weight:600;margin:0 0 4px">Cole 1 pacote por linha:</p>' +
        '<p style="font-family:ui-monospace,monospace;opacity:.7;margin:2px 0">Rua, N\u00famero, Nome, C\u00f3digo (nome e c\u00f3digo s\u00e3o opcionais)</p>' +
        '<p style="font-family:ui-monospace,monospace;opacity:.5;margin:2px 0">Rua Mariz e Barros, 501, Anne Elise, 888030883495876</p></div>' +
        '<textarea id="textoColado" class="card" rows="10" placeholder="Rua Ator Paulo Gustavo, 72, Jo\u00e3o Silva, 888030883491111' + "\n" + 'Rua Mariz e Barros, 501, Anne Elise, 888030883495555" style="width:100%;font-size:14px;font-family:ui-monospace,monospace;padding:12px;margin-bottom:12px;color:var(--ink)">' + esc(state.textoColado) + "</textarea>" +
        '<button class="btn-primary" data-action="organizar"' + (!state.textoColado.trim() ? " disabled" : "") + ">Organizar pacotes</button>";
      return html;
    }

    var resultado = calcularResultado();
    html += renderResumoBar(resultado);

    if (state.filaPendente.length > 0) {
      html += '<button data-action="reenviar-pendentes" class="btn-primary" style="margin-bottom:12px;background:var(--accent);color:var(--ink)"' + (state.enviandoFila ? " disabled" : "") + ">" +
        (state.enviandoFila ? "Reenviando..." : "⏳ " + state.filaPendente.length + " " + plural(state.filaPendente.length, "foto pendente", "fotos pendentes") + " — tentar agora") +
        "</button>";
    }

    if (cloudinaryPronto && state.minhaRota) {
      html += '<button data-action="baixar-zip" class="btn-primary" style="margin-bottom:12px"' + (state.baixandoZip ? " disabled" : "") + ">" +
        (state.baixandoZip ? "Preparando o zip..." : "\u{1F4E5} Baixar fotos de hoje (zip, em ordem)") + "</button>";
    }

    if (resultado.naoMapeadas.length > 0) {
      html += '<div class="warn-box" style="margin-bottom:12px"><strong>ruas n\u00e3o reconhecidas:</strong> ' + resultado.naoMapeadas.map(esc).join(", ") + ' \u2014 cadastre na aba "Faixas".</div>';
    }

    if (resultado.erros.length > 0) {
      html += '<details class="muted" style="margin-bottom:12px;font-size:12px"><summary style="cursor:pointer">' + resultado.erros.length + " " + plural(resultado.erros.length, "linha n\u00e3o reconhecida", "linhas n\u00e3o reconhecidas") + "</summary><ul style='margin-top:4px;padding-left:18px'>" +
        resultado.erros.map(function (e) { return "<li style='font-family:ui-monospace,monospace'>" + esc(e.raw) + "</li>"; }).join("") + "</ul></details>";
    }

    html += renderListaGrupos(resultado);
    return html;
  }

  function renderMapa() {
    var statusTexto = !fbDb
      ? "sem conex\u00e3o com o Firebase \u2014 tudo funciona s\u00f3 neste aparelho."
      : !state.minhaRota
      ? "defina seu c\u00f3digo pra compartilhar o progresso com quem mais estiver nessa rota."
      : state.rotaConectada
      ? "conectado \u2014 compartilhando com quem usar esse mesmo c\u00f3digo."
      : "sem conex\u00e3o em tempo real agora (funcionando localmente).";
    var statusCor = (fbDb && state.minhaRota && state.rotaConectada) ? "var(--ok)" : "var(--alert)";

    var html = '<div class="card" style="padding:12px;margin-bottom:16px">' +
      '<p style="font-size:11px;font-weight:600;margin:0 0 6px;opacity:.65">C\u00d3DIGO DA SUA ROTA</p>' +
      '<div style="display:flex;gap:8px">' +
      '<input id="minhaRotaInput" value="' + esc(state.minhaRota) + '" placeholder="ex: RJ B301-00 088" style="flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--line);font-size:14px;color:var(--ink);background:var(--paper-light)" />' +
      '<button data-action="salvar-rota" style="padding:8px 14px;border-radius:8px;background:var(--ink);color:var(--paper-light);border:none;font-weight:600">Salvar</button>' +
      "</div>" +
      '<p style="font-size:11px;margin:8px 0 0;color:' + statusCor + '">' + statusTexto + "</p>" +
      (fbDb && state.totalRotas > 0 ? '<p style="font-size:11px;margin:6px 0 0;opacity:.55">' + formatarNumero(state.totalRotas) + " " + plural(state.totalRotas, "rota diferente j\u00e1 usou", "rotas diferentes j\u00e1 usaram") + " essa ferramenta</p>" : "") +
      "</div>";

    html += '<p class="muted" style="font-size:14px;margin-bottom:16px">Cadastre suas ruas, a faixa completa (se quiser fragmentar) e escolha as cores. Uma vez s\u00f3 \u2014 elas quase n\u00e3o mudam.</p>';
    html += '<div class="card" style="padding:10px;margin-bottom:16px;display:flex;gap:8px">' +
      '<input id="novoNomeRua" style="flex:1;min-width:0;background:transparent;border:none;font-size:14px;padding:8px;color:var(--ink)" value="' + esc(state.novoNomeRua) + '" placeholder="Nome da nova rua" />' +
      '<button data-action="add-rua" style="border-radius:8px;padding:0 14px;background:var(--accent);border:none;font-weight:700">+</button></div>';

    if (state.mapaRuas.length === 0) {
      html += '<div style="text-align:center;padding:40px 0"><p class="muted" style="font-size:14px">Nenhuma rua cadastrada ainda. Adicione a primeira acima.</p></div>';
      return html;
    }

    var splitsAtual = calcularSplitsPorRua();
    state.mapaRuas.forEach(function (r) {
      var cores = r.cores || coresPadrao();
      var fragmentado = !!r.fragmentar;
      var s = splitsAtual[r.id];

      html += '<div class="card" style="overflow:hidden;margin-bottom:14px">' +
        '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--paper-deep)">' +
        '<span style="flex:1;font-size:14px;font-weight:600">' + esc(r.nome) + "</span>" +
        '<button data-action="del-rua" data-id="' + r.id + '" style="border:none;background:none;color:var(--alert);opacity:.6;font-size:16px;cursor:pointer">\u{1F5D1}</button></div>';

      html += '<div style="padding:10px 12px;border-top:1px solid var(--line)">' +
        '<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">' +
        '<input type="checkbox" data-frag="' + r.id + '"' + (fragmentado ? " checked" : "") + ' style="width:16px;height:16px" />' +
        "Fragmentar em 4 cores, com base nos n\u00fameros de hoje</label>";
      if (s && (s.parTotal || s.imparTotal)) {
        if (fragmentado) {
          html += '<p style="font-size:11px;margin:6px 0 0;opacity:.6">hoje: ' + s.parTotal + " pares (corte no n\u00ba " + (s.parCorte != null ? s.parCorte : "\u2014") + ") \u00b7 " + s.imparTotal + " \u00edmpares (corte no n\u00ba " + (s.imparCorte != null ? s.imparCorte : "\u2014") + ")</p>";
        } else {
          html += '<p style="font-size:11px;margin:6px 0 0;opacity:.6">hoje: ' + s.parTotal + " pares \u00b7 " + s.imparTotal + " \u00edmpares</p>";
        }
      } else {
        html += '<p style="font-size:11px;margin:6px 0 0;opacity:.5">carregue a lista de hoje pra ver a contagem.</p>';
      }
      html += "</div>";

      html += '<div style="padding:4px 12px 10px;border-top:1px solid var(--line)">' +
        '<p style="font-size:11px;font-weight:600;margin:8px 0 0;opacity:.65">CORES</p>';

      if (!fragmentado) {
        html += colorPickRow(r.id, "par1", "PAR", cores.par1) + colorPickRow(r.id, "impar1", "\u00cdMPAR", cores.impar1);
      } else {
        html += colorPickRow(r.id, "par1", "PAR \u00b7 1\u00aa metade", cores.par1) +
          colorPickRow(r.id, "par2", "PAR \u00b7 2\u00aa metade", cores.par2) +
          colorPickRow(r.id, "impar1", "\u00cdMPAR \u00b7 1\u00aa metade", cores.impar1) +
          colorPickRow(r.id, "impar2", "\u00cdMPAR \u00b7 2\u00aa metade", cores.impar2);
      }
      html += "</div></div>";
    });
    return html;
  }

  function colorPickRow(ruaId, campo, label, valor) {
    var chave = ruaId + "|" + campo;
    var aberta = state.paletaAberta === chave;
    var html = '<div class="colorpick-row"><span>' + label + '</span>' +
      '<button data-action="abrir-paleta" data-chave="' + chave + '" class="swatch" style="background:' + valor + '" aria-label="Escolher cor"></button></div>';
    if (aberta) {
      html += '<div style="display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 12px;justify-content:flex-end">';
      PALETA_CORES.forEach(function (cor) {
        var selecionada = normalizar(cor) === normalizar(valor);
        html += '<button data-action="escolher-cor" data-rua="' + ruaId + '" data-campo="' + campo + '" data-cor="' + cor + '" class="swatch-mini" style="background:' + cor + ';border:' + (selecionada ? "2.5px solid var(--ink)" : "1px solid var(--line)") + '" aria-label="' + cor + '"></button>';
      });
      html += "</div>";
    }
    return html;
  }

  // ---------- eventos ----------
  function attachHandlers() {
    var app = document.getElementById("app");

    app.querySelectorAll("[data-tab]").forEach(function (el) {
      el.onclick = function () { setAba(el.getAttribute("data-tab")); };
    });

    var iniciarBtn = app.querySelector('[data-action="iniciar-camera"]');
    if (iniciarBtn) iniciarBtn.onclick = iniciarCamera;
    var alternarBipeBtn = app.querySelector('[data-action="alternar-bipe"]');
    if (alternarBipeBtn) alternarBipeBtn.onclick = alternarBipe;

    var textoEl = document.getElementById("textoColado");
    if (textoEl) textoEl.oninput = function () { state.textoColado = textoEl.value; var btn = app.querySelector('[data-action="organizar"]'); if (btn) btn.disabled = !state.textoColado.trim(); };
    var organizarBtn = app.querySelector('[data-action="organizar"]');

    app.querySelectorAll('[data-action="toggle-separado"]').forEach(function (el) {
      el.onclick = function () {
        var atual = statusDe(el.getAttribute("data-id")).separado;

    });
    app.querySelectorAll('[data-action="marcar-entrega"]').forEach(function (el) {
      el.onclick = function () {
        marcarEntrega(el.getAttribute("data-id"), el.getAttribute("data-campo"));
      };
    });
    app.querySelectorAll('[data-action="ver-foto-pacote"]').forEach(function (el) {
      el.onclick = function () { verFotoPacote(el.getAttribute("data-id")); };
    });
    app.querySelectorAll('[data-action="apagar-foto-pacote"]').forEach(function (el) {
      el.onclick = function () { apagarFotoPacote(el.getAttribute("data-id")); };
    });
    var fecharFotoVisBtn = app.querySelector('[data-action="fechar-foto-visualizando"]');
    if (fecharFotoVisBtn) fecharFotoVisBtn.onclick = fecharFotoVisualizando;
    var apagarFotoVisBtn = app.querySelector('[data-action="apagar-foto-visualizando"]');
    if (apagarFotoVisBtn) {

        if (linhaId) apagarFotoPacote(linhaId);

    app.querySelectorAll('[data-action="foto-fachada"]').forEach(function (el) {

    app.querySelectorAll('[data-action="foto-lote"]').forEach(function (el) {

    });
    app.querySelectorAll('[data-action="quem-recebeu"]').forEach(function (el) {
      var id = el.getAttribute("data-id");
      el.oninput = function () {
        if (!state.entregaInfo[id]) state.entregaInfo[id] = {};
        state.entregaInfo[id].quemRecebeu = el.value;
      };
      el.onblur = function () { salvarQuemRecebeu(id, el.value); };
    });
    app.querySelectorAll('[data-action="quem-recebeu-endereco"]').forEach(function (el) {

    });
    app.querySelectorAll('[data-action="abrir-paleta"]').forEach(function (el) {
      el.onclick = function () { toggleAbrirPaleta(el.getAttribute("data-chave")); };
    });
    app.querySelectorAll('[data-action="escolher-cor"]').forEach(function (el) {
      el.onclick = function () { escolherCor(el.getAttribute("data-rua"), el.getAttribute("data-campo"), el.getAttribute("data-cor")); };
    });
  }

  if (state.minhaRota) conectarRota(state.minhaRota);
  render();
  if (state.filaPendente.length > 0) tentarReenviarFila();
})();
</script>
</body>
</html>
